/* practice-engine/scene.js — the living focal point.
 *
 * The one piece of decoration in the app, and deliberately so: it is what someone rests their
 * eyes on, or does not, while the voice works. Ported from the shipped `player.html` rather
 * than redrawn — every constant in the drawing code came out of a round with Beth or a note
 * from Justin, and none of it is worth rediscovering.
 *
 * ┌─ WHAT CHANGED IN THE PORT, AND WHY IT IS THE POINT ───────────────────────────────────┐
 * │ The shipped version decides its colour with `clipState(b)`, which is a regex over CLIP  │
 * │ IDs — `/^(INVITE|IMG-|OBST|DESC-DEFENSE|NUMB-OK|PEND-DEFENSE|PEND-TO-DEFENSE)/`. That   │
 * │ is §D1 with a paintbrush: renumber the library and the ring shows safety blue over      │
 * │ defense audio, silently, because a regex that matches nothing has no opinion.           │
 * │                                                                                         │
 * │ Here the state comes from the beat's PHASE, which the planner already assigns and the   │
 * │ session already carries, with a short role table for the handful of beats whose phase   │
 * │ cannot say which way they are facing — the swings inside Balancing and Pendulating, and │
 * │ Hold & Watch, which faces both at once. Those roles come from `data.js`. No ID is       │
 * │ spelled here.                                                                           │
 * └─────────────────────────────────────────────────────────────────────────────────────────┘
 *
 * Six scene alternates ride the same canvas and inherit the same eased state colour: the
 * breathing circles read as a PACER to some nervous systems, so there are alternates with no
 * cycle a body can lock onto.
 */

/* ── dual load (browser + Node) ──────────────────────────────────────────────────────────── */
const D = (typeof require === 'function')
  ? require('./data.js')
  : (typeof window !== 'undefined' ? window : globalThis).SNB_ENGINE_DATA;

const RING_BLUE = [88, 145, 197];
const RING_ORANGE = [210, 154, 74];

/* 'both' = holding safety and defense at once: ink centre and ink breathing circle, with the
 * blue (safety) ring OUTSIDE and the orange (defense) ring INSIDE, both present. `outerCol` /
 * `innerCol` default to `col`, so every single-colour state is unchanged. */
const RING_STATE = Object.freeze({
  mind: { col: RING_INK, outer: 1, inner: 0 },
  safety: { col: RING_BLUE, outer: 0, inner: 0 },
  defense: { col: RING_ORANGE, outer: 0, inner: 1 },
  both: { col: RING_INK, outer: 1, inner: 1, outerCol: RING_BLUE, innerCol: RING_ORANGE },
  closing: { col: RING_INK, outer: 0, inner: 0 },
});

/* The planner's phases, mapped onto the four moments the ring knows. `balancing` and
 * `pendulating` fall back to safety because a swing that is not one of the roles below is a
 * safety beat — that is what the swing arcs are made of. */
const PHASE_STATE = Object.freeze({
  opening: 'mind',
  mindfulness: 'mind',
  anchoring: 'safety',
  safety: 'safety',
  gate: 'safety',
  defense: 'defense',
  obstacles: 'defense',
  balancing: 'safety',
  pendulating: 'safety',
  closing: 'closing',

/* The beats whose phase cannot say which way they face. A role wins over a phase. */
function roleStates() {
  const m = new Map();
  m.set(D.ROLE.holdWatch, 'both');            // holding both at once
  m.set(D.ROLE.pendDefense, 'defense');       // the swing toward non-safety
  m.set(D.ROLE.pendToDefense, 'defense');
  m.set(D.ROLE.easeOut, 'closing');           // a branch destination — no phase of its own
  m.set(D.ROLE.easeOutAck, 'closing');

  if (!beat) return 'mind';
  if (!ROLE_STATE) ROLE_STATE = roleStates();
  const byRole = ROLE_STATE.get(beat.id);
  if (byRole) return byRole;
  return PHASE_STATE[beat.phase] || 'safety';

/* ── the scenes ───────────────────────────────────────────────────────────────────────────
 * `circles` is the original; the rest came out of Beth's second round (2026-07-05) because a
 * regular breathing cycle is something a dysregulated body can start chasing. Light phenomena
 * need darkness, so two of them are dark-mode only: in light mode a sunbeam reads as a smudge. */

function pickScene(preferred, isDark, rnd) {
  const random = rnd || Math.random;
  const pool = SCENES.filter(s => isDark || !DARK_ONLY[s]);
  if (SCENES.indexOf(preferred) >= 0 && (isDark || !DARK_ONLY[preferred])) return preferred;

 * fewer points of attention at every width, rather than a denser still image. */

/* ── the renderer ─────────────────────────────────────────────────────────────────────────

 * `runtime` already expose, so the scene subscribes to nothing and owns no state about the
 * practice. Everything below this line is drawing.

  const g = canvas.getContext('2d');
  const reduce = !!reduceMotion;
  const rnd = random || Math.random;
  const SCENE = pickScene(scene, !!isDark, rnd);

  let raf = null, finishAt = 0, wasFinished = false;
  let motes = [], reedArr = [], ripArr = [], strands = [], dust = [], flies = [];
  let ripNext = 0, sT = 0, sLast = 0;
  let bgRGB = [250, 249, 245];
  const rc = RING_INK.slice(), roc = RING_INK.slice(), ric = RING_INK.slice();
  let ro = 1, ri = 0, breath = 0.5, breath2 = 0.5, lastState = 'mind';

  const fieldW = () => canvas.clientWidth || 390;

  function initReeds() {
    reedArr = [];
    const n = density(fieldW() / 100, 7, 22, reduce);
    for (let i = 0; i < n; i++) reedArr.push({ x: (i / (n - 1)) * 0.96 + 0.02 + (rnd() - 0.5) * 0.028, h: 0.24 + rnd() * 0.42, per: 8 + rnd() * 8, ph: rnd() * 6.283, amp: 0.035 + rnd() * 0.045, w: 1.1 + rnd() * 1.5, a: 0.3 + rnd() * 0.32 });
  }
  function initMotes() {
    motes = [];
    const n = density(fieldW() / 70, 9, 20, reduce);
    for (let i = 0; i < n; i++) motes.push({ x: rnd(), y: rnd(), r: 1.5 + rnd() * 3.5, v: (3.5 + rnd() * 8) / 1000, dx: (rnd() - 0.5) * 0.003, a: 0.18 + rnd() * 0.3 });
  }
  function initFlies() {
    flies = [];
    const n = density(fieldW() / 100, 7, 14, reduce);
    for (let i = 0; i < n; i++) flies.push({ x: 0.12 + 0.76 * (i / (n - 1)) + (rnd() - 0.5) * 0.09, y: 0.15 + rnd() * 0.62, per: 5.5 + rnd() * 6.5, ph: rnd() * 10, wx: 8 + rnd() * 9, wy: 6 + rnd() * 8 });
  }
  function seed() {
    try {
      const m = (getComputedStyle(document.body).backgroundColor || '').match(/\d+/g);
      if (m && m.length >= 3) bgRGB = m.slice(0, 3).map(Number);
    } catch (e) {}

    strands = []; dust = []; ripArr = []; ripNext = 0; sT = 0; sLast = 0;
    for (let i = 0; i < 7; i++) strands.push({ y: 0.15 + 0.7 * (i / 6) + (rnd() - 0.5) * 0.06, len: 0.2 + rnd() * 0.22, sp: (28 + rnd() * 46) / 1000, x: rnd() * 1.4 - 0.2, amp: 2.5 + rnd() * 4, ph: rnd() * 6.283, a: 0.22 + rnd() * 0.28 });
    for (let i = 0; i < 8; i++) dust.push({ x: 0.36 + rnd() * 0.24, y: 0.12 + rnd() * 0.72, r: 1 + rnd() * 1.6, per: 9 + rnd() * 11, ph: rnd() * 6.283, ax: 4 + rnd() * 6, ay: 8 + rnd() * 9, a: 0.35 + rnd() * 0.25 });
  }

  function fit() {
    const dpr = (typeof devicePixelRatio !== 'undefined' && devicePixelRatio) || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawScene(W, H, unit, t, moving, e, col) {
    const dt = Math.min(0.05, Math.max(0, t - sLast)); sLast = t; if (moving) sT += dt;
    const fade = 1 - e;
    if (SCENE === 'drift') {
      motes.forEach(m => {
        if (moving) { m.y -= m.v * dt * 3; m.x += m.dx * dt * 3; if (m.y < -0.05) { m.y = 1.05; m.x = rnd(); } }

      if (moving && sT >= ripNext) { ripArr.push({ x: 0.2 + rnd() * 0.6, y: 0.25 + rnd() * 0.5, b: sT }); ripNext = sT + 4 + rnd() * 5; if (ripArr.length > 4) ripArr.shift(); }
      ripArr.forEach(rp => {
        const age = sT - rp.b, life = 6; if (age > life) return;

         * lets go first (gone by ~65% of life); the interior follows. */
        const aOut = (p < 0.08 ? p / 0.08 : Math.max(0, 1 - ((p - 0.08) / 0.57))) * 0.5;
        const aIn = (p < 0.08 ? p / 0.08 : 1 - ((p - 0.08) / 0.92)) * 0.5;

        g.strokeStyle = col(aOut * fade); g.beginPath(); g.arc(rp.x * W, rp.y * H, R, 0, 6.283); g.stroke();

    } else if (SCENE === 'reeds') {
      reedArr.forEach(rd => {
        const sw = Math.sin(sT * 6.283 / rd.per + rd.ph) * rd.amp;
        const bx = rd.x * W, by = H, hh = rd.h * H, tx = bx + sw * hh, ty = by - hh;
        g.strokeStyle = col((rd.a != null ? rd.a : 0.5) * fade); g.lineWidth = rd.w; g.lineCap = 'round';
        g.beginPath(); g.moveTo(bx, by); g.quadraticCurveTo(bx + sw * hh * 0.25, by - hh * 0.55, tx, ty); g.stroke();
      });
    } else if (SCENE === 'breeze') {
      /* straight strands, not wavy ones (Justin 2026-07-06) — clean lines drifting sideways at
       * their own speeds, nothing more. */
      strands.forEach(s => {
        if (moving) { s.x += s.sp * dt; if (s.x > 1.15) { s.x = -0.35; s.y = 0.15 + rnd() * 0.7; } }
        const y0 = s.y * H, x0 = s.x * W, L = s.len * W;
        g.strokeStyle = col(s.a * fade); g.lineWidth = 1.6; g.lineCap = 'round';
        g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + L, y0); g.stroke();
      });
    } else if (SCENE === 'sunbeam') {
      /* light sources stay LIGHT (Justin 2026-07-06): the state colour can run dark, which
       * turned the beam murky and the flies into "bug bites". These two use the fixed warm
       * gold from the approved mockups instead — light is light, whatever the clip is doing. */
      const AMBER = a => 'rgba(246,228,180,' + a + ')';
      const bw = W * 0.34, grd = g.createLinearGradient(0, -H, 0, H);
      grd.addColorStop(0, AMBER(0.30 * fade)); grd.addColorStop(1, AMBER(0.04 * fade));
      g.save(); g.translate(W * 0.5, H * 0.5); g.rotate(0.3); g.fillStyle = grd; g.fillRect(-bw / 2, -H * 1.2, bw, H * 2.4); g.restore();

        const px = (d.x * W) + Math.sin(sT * 6.283 / d.per + d.ph) * d.ax;
        const py = (d.y * H) + Math.cos(sT * 6.283 / (d.per * 1.3) + d.ph) * d.ay;
        /* the specks are the BACKGROUND colour: dust silhouetted in the light, not lit motes */
        g.fillStyle = 'rgba(' + bgRGB[0] + ',' + bgRGB[1] + ',' + bgRGB[2] + ',' + Math.min(1, (0.5 + d.a) * fade) + ')';
        g.beginPath(); g.arc(px, py, d.r, 0, 6.283); g.fill();
      });

      const BONE = a => 'rgba(250,249,245,' + a + ')';
      flies.forEach(f => {
        const p = ((sT + f.ph) % f.per) / f.per, tw = Math.sin(p * Math.PI);
        const px = (f.x * W) + Math.sin(sT * 6.283 / (f.per * 2.1) + f.ph) * f.wx;
        const py = (f.y * H) + Math.cos(sT * 6.283 / (f.per * 1.7) + f.ph) * f.wy;
        g.fillStyle = BONE(0.12 * tw * fade); g.beginPath(); g.arc(px, py, 7, 0, 6.283); g.fill();
        g.fillStyle = BONE(0.3 * tw * fade); g.beginPath(); g.arc(px, py, 4, 0, 6.283); g.fill();

  }

  function frame() {
    raf = requestAnimationFrame(frame);
    const dpr = (typeof devicePixelRatio !== 'undefined' && devicePixelRatio) || 1;
    /* guard against buffer/element size drift: a layout that moved without a resize event
     * stretched the buffer and warped every circle into an oval on the full-bleed canvas. */
    if (Math.round(canvas.clientWidth * dpr) !== canvas.width || Math.round(canvas.clientHeight * dpr) !== canvas.height) fit();

    const W = canvas.clientWidth, H = canvas.clientHeight, cx = W / 2;
    g.clearRect(0, 0, W, H);

    const s = read() || {};
    if (s.finished && !wasFinished) { finishAt = performance.now(); wasFinished = true; }
    if (!s.finished) wasFinished = false;

    const sceneUnit = Math.min(Math.min(W, H), 430);
    /* the circles keep their calm footprint and sit above the caption band; the scenes use the
     * whole field. The cap grew 360 -> 430 for wide screens without touching phones, where
     * W*0.82 governs. */
    const unit = Math.min(W * 0.82, 430, H * 0.48);
    const cy = Math.max(unit * 0.55 + 20, (H - 250) / 2);
    const t = performance.now() / 1000;
    const moving = !!s.playing && !s.paused && !reduce;
    /* when paused or reduced, HOLD the last breath value rather than snapping to a default
     * shape — a circle that jumps on pause reads as a fault, not as rest. */
    if (moving) { breath = Math.sin(t * 0.55) * 0.5 + 0.5; breath2 = Math.sin(t * 0.41 + 0.7) * 0.5 + 0.5; }

    const want = s.finished ? lastState : (lastState = stateFor(s.beat));
    const st = RING_STATE[want] || RING_STATE.mind;
    const soc = st.outerCol || st.col, sic = st.innerCol || st.col;
    for (let i = 0; i < 3; i++) {
      rc[i] += (st.col[i] - rc[i]) * 0.10;
      roc[i] += (soc[i] - roc[i]) * 0.10;
      ric[i] += (sic[i] - ric[i]) * 0.10;
    }
    ro += (st.outer - ro) * 0.08;
    ri += (st.inner - ri) * 0.08;

    /* at the end the ring closes inward and fades, settling into the centre dot */
    let e = 0;
    if (s.finished) { const ct = Math.min(1, (performance.now() - finishAt) / 2200); e = 1 - Math.pow(1 - ct, 3); }

    const r = Math.round(rc[0]), gr = Math.round(rc[1]), bl = Math.round(rc[2]);
    const rgba = a => 'rgba(' + r + ',' + gr + ',' + bl + ',' + a + ')';
    const oc = roc.map(Math.round), ic = ric.map(Math.round);
    const rgbaO = a => 'rgba(' + oc[0] + ',' + oc[1] + ',' + oc[2] + ',' + a + ')';
    const rgbaI = a => 'rgba(' + ic[0] + ',' + ic[1] + ',' + ic[2] + ',' + a + ')';

    if (SCENE !== 'circles') { drawScene(W, H, sceneUnit, t, moving, e, rgba); return; }

    g.lineCap = 'round';

    /* the migrating second ring — a faint thread, OUTSIDE for mindfulness and safety, INSIDE
     * at the defense, both at once when holding. It travels inward as the work deepens. */
    if (ro > 0.01) { g.strokeStyle = rgbaO(0.5 * ro * (1 - e)); g.lineWidth = 1.5; g.beginPath(); g.arc(cx, cy, unit * (0.30 + 0.13 * breath2), 0, Math.PI * 2); g.stroke(); }
    if (ri > 0.01) { g.strokeStyle = rgbaI(0.6 * ri * (1 - e)); g.lineWidth = 1.6; g.beginPath(); g.arc(cx, cy, unit * (0.115 + 0.055 * breath2), 0, Math.PI * 2); g.stroke(); }

    g.strokeStyle = rgba(0.9 * (1 - e)); g.lineWidth = 2.5; g.beginPath(); g.arc(cx, cy, breathR, 0, Math.PI * 2); g.stroke();
    g.fillStyle = 'rgb(' + Math.round(r * 0.82) + ',' + Math.round(gr * 0.82) + ',' + Math.round(bl * 0.82) + ')';

    fit();
    if (reduce) return;
    if (reedArr.length && density(fieldW() / 100, 7, 22, false) !== reedArr.length) initReeds();
    if (motes.length && density(fieldW() / 70, 9, 20, false) !== motes.length) initMotes();
    if (flies.length && density(fieldW() / 100, 7, 14, false) !== flies.length) initFlies();
  };

  addEventListener('resize', onResize);

  const P = G.SNB_ENGINE_PLAN;
  const H = G.SNB_ENGINE_HOST;
  const S = G.SNB_ENGINE_SESSION;
  const ST = G.SNB_ENGINE_STALL;

   * is the app's own public API. So the player can simply ASK, and `host.firstPracticeFrom`

   * the options and the whole customizer stay clipped to zero height, present in the DOM and
   * invisible. (Caught 2026-09-01 by a screenshot, not by a test — the browser test autostarts
   * and never sees the chooser, which is a gap it has since had closed.)
   *
   * A fixed max-height would clip too, since `more options` grows the content, so it is
   * measured — here and on every toggle of that disclosure. */
  function sizeReveal() {
    const rv = $('reveal');
    rv.style.maxHeight = cfg.track ? rv.scrollHeight + 'px' : '0px';
  }

  // ── building and running one practice ─────────────────────────────────────────────────

  let session = null, stall = null, scene = null, device = null;
  let caption = null, capsOn = false, ctrlTimer = null, curFile = '';

  function planCfg() {
    return {
      anchor: cfg.anchor, sense: cfg.sense, practice: cfg.practice,
      mode: cfg.mode, type: isShort(cfg.practice) ? 'micro' : 'full',
      first: !!cfg.first, plain: !!cfg.plain, silence: cfg.silence,
      depth: cfg.depth || undefined, prefix: cfg.prefix || undefined,
      holdWatch: !!cfg.holdWatch, holdSeconds: cfg.holdSeconds,
      /* which four of the thirty-two obstacle statements is not a sequencing decision, so the
       * planner takes them in order unless a dealer is supplied. Here is where the shuffle
       * belongs — a plan has to be reproducible to be assertable, and a session does not. */
      deal: pool => {
        const bag = pool.slice();
        for (let i = bag.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = bag[i]; bag[i] = bag[j]; bag[j] = t;
        }
        return bag.slice(0, P.STATEMENTS_PER_PRACTICE);
      },
    };
  }

  function begin() {
    const plan = P.plan(planCfg());
    device = browserDevice({ audio: $('au'), base: BASE });
    session = new S.Session({
      plan, device,
      onEvent: onSessionEvent,
    });
    stall = new ST.StallWatch({
      device,
      state: () => session.runtime.state(),
      play: () => session.runtime.nudge(),
    }).start();

    const player = $('player');
    player.className = 'screen';
    player.classList.add('show-controls');
    showScreen('player');

    if (!scene) {
      scene = SCENE.mountScene({
        canvas: $('ring'),
        read: () => ({
          beat: session ? session.beat : null,
          playing: session ? session.runtime.playing : false,
          paused: session ? session.runtime.paused : false,
          finished: session ? session.runtime.finished : false,
        }),
        scene: readSetting('snb_practice_scene', ''),
        isDark: !!G._SNB_DARK,
        reduceMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
      });
    }

    setStarting(COPY.UI.starting);
    showSilence();
    session.start();
    revealControls();
  }

  function readSetting(key, fallback) {
    try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
  }

  // ── the session's events, on screen ───────────────────────────────────────────────────

  function onSessionEvent(e) {
    const player = $('player');
    switch (e.type) {
      case 'beat':
        /* every intro beat carries `skippable`, and nothing else in any plan does, so the first
         * beat without it is the moment the introduction is behind them. */
        if (cfg.first && session && session.beat && !session.beat.skippable) markIntroSeen();
        curFile = (e.src || '').split('/').pop();
        caption = CAPS.captionFor(CAPTIONS[curFile] || '');
        renderCaption(true);
        setStarting('');
        break;
      case 'gap':
        /* the caption belongs to a clip. During the silence there is nothing being said, so
         * there is nothing to read — clearing it is the difference between a quiet gap and a
         * sentence someone is still trying to finish reading. */
        caption = null; renderCaption(true);
        break;
      case 'paused': player.classList.add('paused'); setPauseGlyph(true); revealControls(); break;
      case 'resumed': player.classList.remove('paused'); setPauseGlyph(false); revealControls(); break;
      case 'tap-armed': setStarting(COPY.UI.tapToStart); break;
      case 'conn-trouble': player.classList.add('conn-trouble'); break;
      case 'control-open':
        openChoice(e.control);
        /* ✅ THE TRANSPORT EASE-OUT COMES DOWN WHEN THE OPEN ENDING'S OWN EXIT GOES UP
         * (Justin, 2026-09-17). Before the open ending it is still right — an open practice can be
         * abandoned partway through the guided part, and there genuinely is rest left to leave.
         * Inside the open ending the two are the same event, and only one of them says it properly. */
        if (e.control === 'finish') $('player').classList.add('finishable');
        break;
      case 'control-close': closeChoice(); break;
      case 'transport-more-safety': player.classList.add('more-safety'); break;
      case 'ease-out': player.classList.remove('more-safety'); break;
      case 'complete': finish(); break;
      default: break;
    }
  }

  function finish() {
    const player = $('player');
    player.classList.add('finished');
    player.classList.add('show-controls');
    closeChoice();
    if (stall) { stall.stop(); stall = null; }
    post(session.completion(launch.practice ? { practice: launch.practice } : null));
  }

  function exitNow() {
    if (!session) return;
    closeChoice();
    if (stall) { stall.stop(); stall = null; }
    session.stop();
    post(session.completion(launch.practice ? { practice: launch.practice } : null));
  }

  // ── captions ──────────────────────────────────────────────────────────────────────────

  let CAPTIONS = {};
  /* the transcript follows the playback trims in data.js TAKE_TRIMS, so the caption never
   * shows words that were cut */
  fetch(CAPTIONS_URL).then(r => (r.ok ? r.json() : {})).then(j => { CAPTIONS = D.applyCaptionTrims(j || {}); }).catch(() => {});

  let capFadeT = null, capShown = null;
  function renderCaption(force) {
    if (!capsOn) return;
    const au = $('au');
    const text = (!caption || caption.empty) ? ''
      : caption.at(CAPS.progressOf(au.currentTime, au.duration, caption.chunks.length));
    if (text === capShown && !force) return;
    capShown = text;
    const node = $('captext');
    node.classList.remove('in');
    clearTimeout(capFadeT);
    capFadeT = setTimeout(() => {
      node.textContent = text;
      if (text) { void node.offsetWidth; node.classList.add('in'); }
    }, 260);
  }

  // ── the choice cards (E5) ─────────────────────────────────────────────────────────────

  /* E5.30 — a choice point gets its OWN visible target. `pointerdown` on the player reveals
   * the controls, so a question answered by "tapping the screen" would be answered by anyone
   * reaching for pause. These buttons are the only things that answer, and they are the only
   * part of the player that is visible without a reveal.
   * E5.33 — silence is never an answer. Nothing here starts a timer and nothing defaults; the
   * card comes down when the session closes the window, and no branch is taken. */
  /* `quiet` is the styling, not the meaning: it marks a target that is not the path the practice
   * is already on. A spoken YES is quiet because doing nothing already says it. */
  const CHOICE_BUTTONS = {
    curiosity: [
      { option: 'yes', label: () => COPY.UI.curiosityYes, quiet: true },
      { option: 'no', label: () => COPY.UI.curiosityNo, quiet: false },
    ],
    /* ✅ PERMIT-DEFENSE, 2026-09-17. The clip ends "You can say yes or no" and until now nothing
     * on screen said it. `no` rewinds for more safety — it does not end the practice. */
    permit: [
      { option: 'yes', label: () => COPY.UI.permitYes, quiet: true },
      { option: 'no', label: () => COPY.UI.permitNo, quiet: false },
    ],
    /* 2026-09-05: the Interest Impulse practice records its yes/no (both quiet — neither is
     * the "right" answer), and CAP-CHECK mid-Pendulating offers the spoken no. */
    'interest-answer': [
      { option: 'yes', label: () => COPY.UI.interestYes, quiet: true },
      { option: 'no', label: () => COPY.UI.interestNo, quiet: true },
    ],
    'capacity-check': [
      { option: 'yes', label: () => COPY.UI.capacityCheckYes, quiet: true },
      { option: 'no', label: () => COPY.UI.capacityCheckNo, quiet: true },
    ],
    /* ✅ The open ending's exit, 2026-09-17 — the button SETUP-MODE-OPEN has always promised. */
    finish: [{ option: 'finish', label: () => COPY.UI.finishNow, quiet: false }],
    skip: [{ option: 'skip', label: () => COPY.UI.skipIntro, quiet: true }],
  };

  function openChoice(control) {
    const card = $('choicecard');
    card.textContent = '';
    (CHOICE_BUTTONS[control] || []).forEach(spec => {
      const b = el('button', 'choicebtn' + (spec.quiet ? ' quietly' : ''), spec.label());
      b.type = 'button';
      /* stopPropagation, not preventDefault: the reveal listener sits on the player and this
       * tap is an ANSWER, not a request to see the transport. */
      b.addEventListener('pointerdown', ev => ev.stopPropagation());
      b.onclick = () => {
        if (control === 'skip') session.skip();
        else session.answer(control, spec.option);
      };
      card.appendChild(b);
    });
    $('player').classList.add('choosing');
  }

  function closeChoice() {
    $('player').classList.remove('choosing');
    $('choicecard').textContent = '';
  }

  // ── the transport ─────────────────────────────────────────────────────────────────────

  function setPauseGlyph(paused) {
    const b = $('pause');
    b.classList.toggle('is-paused', paused);
    b.setAttribute('aria-label', paused ? COPY.UI.resume : COPY.UI.pause);
  }

  function setStarting(text) {
    const s = $('starting');
    s.textContent = text || '';
    s.classList.toggle('show', !!text);
  }

  function revealControls() {
    const p = $('player');
    p.classList.add('show-controls');
    clearTimeout(ctrlTimer);
    if (!session || session.runtime.finished || session.runtime.paused) return;
    ctrlTimer = setTimeout(() => { p.classList.remove('show-controls'); }, 4500);
  }

  function showSilence() { $('silnow').textContent = cfg.silence + 's'; }

  /* E4.24 — the stepper walks the SAME list the setup chips render, so the two vocabularies
   * that used to disagree are now one list in one file. */
  function stepSilence(delta) {
    const steps = COPY.SILENCE_STEPS;
    let i = steps.indexOf(cfg.silence);
    if (i < 0) i = steps.reduce((best, s, k) => (Math.abs(s - cfg.silence) < Math.abs(steps[best] - cfg.silence) ? k : best), 0);
    i = Math.max(0, Math.min(steps.length - 1, i + delta));
    cfg.silence = steps[i];
    showSilence();
    /* E4.25 — the gap belongs to the practice that owns the beat, not to a module-global.
     * Changing it mid-practice rewrites the beats that have not played yet, and nothing else. */
    if (session) {
      session.queue.forEach((b, k) => { if (k > session.runtime.idx) b.gap = P.gapFor(b, cfg.silence); });
    }
  }

  // ── wiring ────────────────────────────────────────────────────────────────────────────

  /* Every fixed string on both screens, painted once from `copy.js`. The markup ships with
   * empty elements on purpose: a label typed into the HTML is a second place for a word to
   * live, and the second place is the one that gets missed when Justin renames something. */
  function paintStatic() {
    const U = COPY.UI;
    const set = (id, text) => { const n = $(id); if (n) n.textContent = text; };
    set('welcome', U.welcome);
    set('notapptext', U.notFromApp);
    set('harnessbar', U.harness);
    set('gobacktext', U.back);
    set('adjusttext', U.moreOptions);
    set('eyPractice', U.eyebrowPractice);
    set('eyAnchor', U.eyebrowAnchor);
    set('eySilence', U.eyebrowSilence);
    set('eyLength', U.eyebrowLength);
    set('eyDescribe', U.eyebrowDescribe);
    set('eyPrefix', U.eyebrowPrefix);
    set('eyHold', U.eyebrowHold);
    set('eyHoldLength', U.eyebrowHoldLength);
    set('beginhelp', U.beginHelp);
    set('begin', U.begin);
    set('conn', U.connTrouble);
    set('sillabel', U.silence);
    set('cclabel', U.captions);
    set('capstate', U.captionsOff);
    set('easeout', U.easeOut);
    set('moresafety', U.moreSafetyAgain);
    set('stopbtn', U.endNow);
    set('againbtn', U.goAgain);
    set('overbtn', U.chooseAnother);
    set('restbtn', U.end);
    set('restagain', U.beginAgain);
    $('lesssil').setAttribute('aria-label', U.lessSilence);
    $('moresil').setAttribute('aria-label', U.moreSilence);
    $('rewind').setAttribute('aria-label', U.rewind);
    $('prevclip').setAttribute('aria-label', U.previous);
    $('pause').setAttribute('aria-label', U.pause);
  }

  function wire() {
    paintStatic();
    $('begin').onclick = () => { if (cfg.practice) begin(); };
    $('goback').onclick = () => { cfg.track = null; cfg.practice = null; render(); };

    /* the disclosure changes the content height, so the container has to be re-measured or
     * everything below the fold is clipped away. */
    $('adjust').addEventListener('toggle', () => { $('reveal').style.maxHeight = 'none'; requestAnimationFrame(sizeReveal); });

    $('player').addEventListener('pointerdown', () => {
      if (session && (session.runtime.playing || session.runtime.finished)) revealControls();
    });
    const controls = document.querySelector('.controls');
    controls.addEventListener('pointerenter', () => { clearTimeout(ctrlTimer); $('player').classList.add('show-controls'); });
    controls.addEventListener('pointerleave', () => revealControls());

    $('pause').onclick = () => { session.runtime.togglePause(); revealControls(); };
    $('rewind').onclick = () => { session.runtime.rewind(5); revealControls(); };
    $('prevclip').onclick = () => { session.runtime.previousBeat(); revealControls(); };
    $('lesssil').onclick = () => { stepSilence(-1); revealControls(); };
    $('moresil').onclick = () => { stepSilence(1); revealControls(); };

    $('captoggle').onclick = () => {
      capsOn = !capsOn;
      $('capstate').textContent = capsOn ? COPY.UI.captionsOn : COPY.UI.captionsOff;
      $('captoggle').classList.toggle('on', capsOn);
      $('captoggle').setAttribute('aria-pressed', capsOn ? 'true' : 'false');
      $('player').classList.toggle('caps-on', capsOn);
      capShown = null;
      renderCaption(true);
      revealControls();
    };

    /* the three ways out. Only the button gets an acknowledgment clip — see session.js. */
    $('easeout').onclick = () => { session.easeOutFromTransport(); revealControls(); };
    $('moresafety').onclick = () => { session.moreSafetyFromTransport(); revealControls(); };
    $('stopbtn').onclick = () => { exitNow(); showScreen('setup'); resetPlayer(); };

    $('againbtn').onclick = () => { resetPlayer(); begin(); };
    $('overbtn').onclick = () => { resetPlayer(); showScreen('setup'); };
    $('restbtn').onclick = () => { $('player').classList.add('rested'); };
    $('restagain').onclick = () => { resetPlayer(); begin(); };

    /* the caption is paced by the media clock, so it is driven by the media clock */
    $('au').addEventListener('timeupdate', () => renderCaption(false));

    /* §A4.8 — the tap that starts audio a browser refused to autoplay. It is armed by the
     * runtime, never by this file, and never while the screen is off. */
    $('player').addEventListener('click', () => { if (session) session.runtime.tap(); });
  }

  function resetPlayer() {
    const p = $('player');
    p.className = 'screen hidden';
    if (stall) { stall.stop(); stall = null; }
    if (session) { session.runtime.stop(); session = null; }
    setStarting('');
    closeChoice();
  }

  // ── boot ──────────────────────────────────────────────────────────────────────────────

  function boot() {
    wire();
    if (embedded) document.body.classList.add('embed');

    if (launch.practice) {
      choosePractice(launch.practice, true);
      if (launch.anchor) cfg.anchor = launch.anchor;
      if (launch.sense) cfg.sense = launch.sense;
      if (launch.mode) cfg.mode = launch.mode;
      /* NOT `launch.first` on its own any more — see `host.firstPracticeFrom`. The app's
       * explicit word still wins where it sends one; otherwise the player asks the app's own
       * record how many practices this person has done. */
      cfg.first = H.firstPracticeFrom(launch, hostMemory());
      if (launch.prefix) cfg.prefix = launch.prefix;
      if (launch.depth) cfg.depth = launch.depth;
      if (launch.holdWatch) cfg.holdWatch = true;
      if (launch.holdSeconds) cfg.holdSeconds = launch.holdSeconds;
      /* `silence` is the one launch parameter that takes any integer that parses (§A1.7), so
       * it is snapped onto the one vocabulary here rather than being allowed to open a
       * practice on a value no control can show. */
      if (typeof launch.silence === 'number') {
        cfg.silence = COPY.SILENCE_STEPS.reduce((b, s) =>
          (Math.abs(s - launch.silence) < Math.abs(b - launch.silence) ? s : b), COPY.SILENCE_STEPS[0]);
      }
    }

    /* The app launches with a practice AND autostart, so that is the only path a member takes:
     * straight into the player, no chooser. Everything else is development. */
    if (launch.practice && launch.autostart) { showScreen('player'); return begin(); }
    if (devHarness) { render(); return showScreen('setup'); }
    if (launch.practice) { render(); return showScreen('setup'); }   // params but no autostart — still dev
    showScreen('notapp');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  /* exposed for the browser end-to-end test, which drives this page with a stub clip server.
   * Nothing in the app reads it. */
  G.__SNB_PAGE = {
    get session() { return session; },
    get cfg() { return cfg; },
    begin, render, choosePractice,
  };
})();

})();
/* @endmodule page.js */</script>
<script>
if('serviceWorker' in navigator){
  /* §A4.9 — THE DISAPPEARING-PRACTICE BUG (reported by Michelle, 2026-08-16). This used to
     reload unconditionally on `controllerchange`, and a shell update landing mid-practice
     destroyed the practice — not paused, gone, and never recorded, because a session is only
     reported at the end. A shell update is never urgent enough to end someone's practice.
     The deferral itself lives in `runtime.js`, where it is tested; this block only registers
     the worker and hands it the runtime's decision. */
  addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      try{ if(!(window.__SNB_PAGE&&window.__SNB_PAGE.session&&window.__SNB_PAGE.session.runtime.playing)) reg.update(); }catch(e){}
    }).catch(()=>{});
  });
}
</script>
</body>
</html>
