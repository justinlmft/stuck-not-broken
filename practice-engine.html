  is an offline hole". `SHELL` is network-first and every JS entry in it carries its own `?v=`,

  reintroduced by the packaging instead of by the code.

  it is generated, with an md5 check per inlined module so "the page shipped" and "the suites

<style>
/* practice-engine/page.css — the look, carried over from the shipped player.
 *
 * Tokens, type ramp, dark mode and every component below are `player.html`'s, because the two
 * pages have to be indistinguishable to a listener: this one replaces the other inside the
 * same app shell, and a practice that suddenly looks different reads as a different product.
 *
 * What is NOT here, and why: the stacked-practice tabs, the standalone-pack list, the
 * between-practices break, and the Circle pop-out / install hint. Stacking is cut (PART F.3 —
 * "they do not come across to the new engine"), the packs do not run on this engine at all,
 * and carrying their CSS forward would be the same mistake as carrying their code — dead rules
 * that look load-bearing to the next person. Everything below is reachable from this page's
 * own markup.
 */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

:root{
  --bone:#FAF9F5;--bone-deep:#F0EEE7;--hairline:#D8D2C2;--ink:#1A1F2A;--ink-80:#3A3F4A;--muted:#4E4A41;--link:#0645AD;
  --leaf:#5BA070;--amber:#D29A4A;--sky:#5891C5;
  --track-mind-ink:#1A1F2A;--track-safety-ink:#5891C5;--track-self-ink:#D29A4A;
  --btn-hover:#2A3040;--rbtn:10px;--rcard:14px;
  --ease:cubic-bezier(.2,.6,.2,1);
  --gentle:cubic-bezier(.25,.46,.3,1);
  /* --type-user is the person's text-size setting, read from the app's own localStorage at
     boot; --type-fluid is the device ramp; --type-scale is what every calc() below reads. */
  --type-user:1;
  --type-fluid:1.133;
  --type-scale:calc(var(--type-user) * var(--type-fluid));
}
@media (min-width:720px){ :root{ --type-fluid:1.2; } }
@media (min-width:1120px){ :root{ --type-fluid:1.267; } }
:root.theme-dark{
  --bone:#1B1C1E;--bone-deep:#24262A;--hairline:#3A3C42;--ink:#ECEAE3;
  --ink-80:#C5C3BC;--muted:#C0BCB2;--link:#8FB6EE;--btn-hover:#D7D5CE;
  --track-mind-ink:#ECEAE3;--track-safety-ink:#5891C5;--track-self-ink:#D29A4A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bone)}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bone);color:var(--ink);
  font-size:calc(17px * var(--type-scale));line-height:1.65;-webkit-font-smoothing:antialiased;
  min-height:100svh;overflow-y:auto;overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.page{width:100%;max-width:600px;margin:0 auto;min-height:100svh;padding:clamp(15px,3vh,30px) 28px clamp(16px,3vh,28px);display:flex;flex-direction:column}

/* ───── brand bar ───── */
.brand{display:flex;align-items:center;gap:12px;margin:0 0 clamp(16px,3.6vh,30px);flex:none}
.brand .mark{height:21px;width:auto;display:block}
.mark path{fill:var(--ink);transition:fill .4s var(--ease)}
.eyebrow{font-size:calc(12.5px * var(--type-scale));font-weight:500;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.chooser .block>.eyebrow{display:flex;align-items:center;gap:8px;color:var(--trk-ink,var(--ink-80))}
.chooser .eyebrow::before{content:"";width:16px;height:2px;border-radius:1px;background:var(--trk,var(--muted));flex:none}

/* ───── setup layout (fits one screen) ───── */
.screen{display:flex;flex-direction:column;flex:1;min-height:0}
#setup{justify-content:flex-end;gap:clamp(14px,2.6vh,24px)}
.hidden{display:none !important}
.chooser{display:flex;flex:1;min-height:0;flex-direction:column;justify-content:flex-end;gap:clamp(13px,2.4vh,22px)}
.welcome{font-size:calc(16px * var(--type-scale));line-height:1.5;color:var(--ink-80);margin:0 0 2px;max-width:23em;text-wrap:pretty}
.chooser.picked .welcome{display:none}
.block{margin:0}
.block>.eyebrow{display:block;margin-bottom:11px}
.choices{display:flex;flex-direction:column}
.choices .opt{margin-bottom:10px}
.choices .opt:last-child{margin-bottom:0}
.opt{
  display:flex;align-items:center;width:100%;text-align:left;
  font:inherit;color:inherit;cursor:pointer;
  background:transparent;border:1px solid var(--hairline);border-radius:var(--rcard);
  padding:19px 22px;max-height:140px;overflow:hidden;
  transition:border-color var(--ease) .3s,border-width var(--ease) .3s,box-shadow var(--ease) .3s,max-height var(--gentle) .6s,opacity var(--gentle) .55s,padding var(--gentle) .6s,margin var(--gentle) .6s;
}
@media(hover:hover){.opt:not(.on):hover{border-color:var(--ink-80);box-shadow:inset 0 0 0 1px var(--ink-80)}}
@media(hover:hover){.opt.track-sky.on:hover{box-shadow:inset 0 0 0 1px var(--sky)}}
@media(hover:hover){.opt.track-amber.on:hover{box-shadow:inset 0 0 0 1px var(--amber)}}
.opt.on{border-width:2px;padding:18px 21px}
.opt.on .t{font-weight:500;color:var(--ink)}
.opt.track-sky.on{border-color:var(--sky)}
.opt.track-ink.on{border-color:var(--ink)}
.opt.track-amber.on{border-color:var(--amber)}
.opt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.opt-text{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.opt .t{display:block;flex:none;min-width:0;font-size:calc(18px * var(--type-scale));line-height:1.3;font-weight:400;transition:font-weight var(--ease) .2s}
.opt .sub{font-size:calc(13px * var(--type-scale));line-height:1.3;color:var(--muted);font-weight:400}
.chooser.picked .sub{display:none}
.opt-aff{flex:none;width:9px;height:9px;margin-left:14px;border-right:1.5px solid var(--muted);border-top:1.5px solid var(--muted);transform:rotate(45deg);transition:transform var(--ease) .3s,border-color var(--ease) .2s}
.opt.on .opt-aff{border-color:var(--ink)}
.chooser.picked .opt.on .opt-aff{transform:rotate(135deg)}
.chooser.picked .choices .opt:not(.on){max-height:0;opacity:0;margin:0;padding-top:0;padding-bottom:0;border-width:0;pointer-events:none}
.goback{position:relative;display:none;align-items:center;gap:8px;background:transparent;border:0;padding:0;margin:0 0 6px;cursor:pointer;font:inherit;font-size:calc(15px * var(--type-scale));color:var(--ink-80);transition:color var(--ease) .2s}
.chooser.picked .goback{display:inline-flex}
.goback::before{content:'';position:absolute;inset:-13px -8px}
.goback:hover{color:var(--ink)}
.goback .ba{width:8px;height:8px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);display:inline-block}
.goback:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.chooser:not(.picked) .summary{display:none !important}
.chooser.picked .begin-help{display:none}
.reveal{max-height:0;opacity:0;overflow:hidden;pointer-events:none;transition:max-height .7s var(--gentle),opacity .6s var(--gentle)}
.reveal-inner{display:flex;flex-direction:column;gap:clamp(13px,2.4vh,22px)}
.chooser.picked .reveal{opacity:1;pointer-events:auto}

/* ───── contextual refinements ───── */
.refine{display:flex;flex-direction:column;gap:clamp(11px,2vh,18px);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;min-height:44px;
  font:inherit;font-size:calc(14px * var(--type-scale));cursor:pointer;white-space:nowrap;
  background:transparent;color:var(--muted);border:1px solid var(--hairline);
  border-radius:999px;padding:7px 15px;transition:border-color var(--ease) .2s,color var(--ease) .2s,font-weight var(--ease) .2s;
}
.chip:hover{border-color:var(--ink-80);color:var(--ink-80)}
.chip.on{border-color:var(--ink);color:var(--ink);font-weight:500}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ───── more options ───── */
.adjust{margin:0}
.adjust summary{font-size:calc(14px * var(--type-scale));color:var(--muted);cursor:pointer;list-style:none;display:inline-flex;align-items:center;min-height:44px;gap:9px;width:auto;transition:color var(--ease) .2s}
.adjust summary:hover{color:var(--ink)}
.adjust summary::-webkit-details-marker{display:none}
.adjust summary .tw{width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);transition:transform var(--ease) .2s;margin-bottom:2px}
.adjust[open] summary .tw{transform:rotate(-135deg);margin-bottom:-3px}
.adjust[open] summary{margin-bottom:20px}
.adjust summary:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
.adjust-body{display:flex;flex-direction:column;gap:22px}

/* ───── summary + begin (pinned low) ───── */
.foot{display:flex;flex-direction:column;gap:14px;flex:none;padding-top:clamp(16px,3vh,26px)}
.summary{font-size:calc(15px * var(--type-scale));color:var(--ink-80);margin:0;min-height:1.4em;text-wrap:pretty}
.summary b{font-weight:500;color:var(--ink)}
.begin-help{font-size:calc(13px * var(--type-scale));color:var(--muted);margin:0;text-align:left;text-wrap:pretty}
.btn{
  font:inherit;font-weight:500;white-space:nowrap;cursor:pointer;
  background:var(--ink);color:var(--bone);border:1px solid var(--ink);
  border-radius:var(--rbtn);padding:13px 30px;transition:box-shadow var(--ease) .25s,transform var(--ease) .2s,border-color var(--ease) .2s,color var(--ease) .2s;
}
.btn:hover{box-shadow:0 0 0 2px var(--bone),0 0 0 3.5px var(--ink);transform:translateY(-1px)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn.primary{width:100%;padding:18px 30px;font-size:calc(17px * var(--type-scale));border-radius:14px}
.btn.quiet{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.quiet:hover{box-shadow:inset 0 0 0 1px var(--ink);transform:translateY(-1px)}
body.playing .brand{display:none}

/* ── the testing harness banner ────────────────────────────────────────────────────────────
   Deliberately ugly. This screen is reachable only with `?dev=1`, and the whole reason it is
   marked is that a screenshot of it was once sent to Justin as if it were the product. It must
   never again be possible to mistake this for a member surface. */
.harnessbar{
  margin:0 0 4px;padding:8px 12px;border-radius:8px;
  background:repeating-linear-gradient(45deg,var(--amber) 0 10px,transparent 10px 20px),var(--bone-deep);
  border:1.5px dashed var(--amber);
  font-size:calc(12px * var(--type-scale));font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink);
}
#notapp{justify-content:center;align-items:flex-start}
#notapp .welcome{margin:0}

/* ───── player ───── */
#player{align-items:center;justify-content:center;text-align:center;gap:0;position:relative}
.stage{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:192px;position:relative;z-index:1}
.ringwrap{position:fixed;inset:0;z-index:0;padding:0}
.pfoot{position:absolute;left:0;right:0;bottom:0;width:100%;display:flex;flex-direction:column;align-items:stretch;z-index:2}
.pfoot::before{content:'';position:absolute;left:calc((100% - 100vw)/2);right:calc((100% - 100vw)/2);top:-64px;bottom:0;background:linear-gradient(to top,var(--bone) 0%,var(--bone) 72%,transparent 100%);opacity:0;transition:opacity .5s var(--ease);pointer-events:none;z-index:-1}
#player.show-controls .pfoot::before{opacity:1}
#ring{width:100%;height:100%;display:block}
#player::before{content:'';position:fixed;top:0;left:0;right:0;height:76px;background:linear-gradient(to bottom,var(--bone) 18%,transparent 100%);z-index:1;pointer-events:none}
.starting{font-size:calc(13px * var(--type-scale));letter-spacing:.14em;color:var(--muted);margin:0;min-height:1.4em;text-align:center;opacity:0;transition:opacity .6s var(--ease);position:fixed;left:24px;right:24px;top:calc(50vh + 40px);z-index:1}
.starting.show{opacity:1;animation:startpulse 1.9s ease-in-out infinite}
@keyframes startpulse{0%,100%{opacity:.4}50%{opacity:.85}}
@media (prefers-reduced-motion:reduce){.starting.show{animation:none;opacity:.7}}
.caption{display:flex;align-items:center;justify-content:flex-start;height:5em;font-size:calc(17px * var(--type-scale));line-height:1.65;color:var(--ink-80);max-width:none;width:100%;margin:0 0 18px;text-align:left;text-wrap:pretty;padding:0;position:relative;z-index:1}
#player.caps-on .caption::before{content:'';position:absolute;left:calc((100% - 100vw)/2);right:calc((100% - 100vw)/2);top:-42px;bottom:-14px;background:linear-gradient(to top,var(--bone) 0%,var(--bone) 68%,transparent 100%);pointer-events:none;z-index:-1}
#player:not(.caps-on) .caption{display:none}
#player .ringwrap,#player .caption,#player .starting,#player .controlbar,#player .endings{transition:opacity .45s var(--ease)}
#player.paused .ringwrap,#player.paused .caption,#player.paused .controlbar,#player.paused .endings{opacity:.38}
.cap-text{display:inline-block;opacity:0;transform:translateY(7px);filter:blur(2px);transition:opacity .6s var(--ease),transform .6s var(--ease),filter .6s var(--ease);will-change:opacity,transform,filter}
.cap-text.in{opacity:1;transform:none;filter:blur(0)}
@media (prefers-reduced-motion:reduce){.cap-text{transform:none;filter:none;transition:opacity .4s var(--ease)}}
.controls{display:flex;flex-direction:column;gap:18px;align-items:stretch;width:100%;opacity:0;pointer-events:none;transition:opacity .55s var(--ease)}
#player.show-controls .controls{opacity:1;pointer-events:auto}
#player.show-controls .controls>*{animation:riseIn .5s var(--ease) both}
#player.show-controls .controls>*:nth-child(2){animation-delay:.06s}
#player.show-controls .controls>*:nth-child(3){animation-delay:.12s}

/* ── the choice card (E5.28, E5.30) ───────────────────────────────────────────────────────
   A choice point gets its OWN visible target. `pointerdown` anywhere on the player reveals the
   controls, so a question answered by tapping "the screen" would be answered by anyone
   reaching for pause. These buttons sit above the control bar, are the only things that
   answer, and — unlike the controls — they are visible WITHOUT a reveal, because a question
   nobody can see is a question nobody was asked.
   E4.23: the card is up from the start of the beat until the end of the gap after it, which is
   the session's window, not a timeout of its own. */
.choicecard{display:none;flex-direction:column;gap:9px;width:100%;margin:0 0 16px;position:relative;z-index:3}
#player.choosing .choicecard{display:flex;animation:riseIn .45s var(--ease)}
.choicebtn{
  width:100%;font:inherit;font-size:calc(15px * var(--type-scale));font-weight:500;cursor:pointer;
  background:var(--bone);color:var(--ink);border:1.5px solid var(--ink);border-radius:14px;
  padding:15px 20px;min-height:54px;text-align:center;
  transition:box-shadow var(--ease) .2s,transform var(--ease) .2s;
}
.choicebtn:hover{box-shadow:0 0 0 1.5px var(--ink)}
.choicebtn:active{transform:scale(.985)}
.choicebtn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.choicebtn.quietly{font-weight:400;border-color:var(--hairline);color:var(--ink-80)}
.choicebtn.quietly:hover{border-color:var(--ink-80);box-shadow:0 0 0 1px var(--ink-80)}

/* ── primary transport ── */
.transport{flex:1 1 auto;min-width:48px;height:54px;border-radius:15px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:box-shadow var(--ease) .2s,transform var(--ease) .2s}
.transport:hover{box-shadow:0 0 0 1.5px var(--ink)}
.transport:active{transform:scale(.96)}
.transport:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.transport .ico{width:27px;height:27px;display:block;fill:var(--ink);color:var(--ink)}
.transport .ico-play{display:none;margin-left:3px}
.transport.is-paused .ico-pause{display:none}
.transport.is-paused .ico-play{display:block}
.transport.mini{flex:0 0 auto;width:46px;min-width:46px}
.transport.mini .rw{position:relative;display:flex;align-items:center;justify-content:center;width:28px;height:28px;color:var(--ink)}
.transport.mini .rw svg{width:28px;height:28px;display:block;stroke:var(--ink)}
.transport.mini .rw5{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:500 10px/1 Inter,system-ui,sans-serif;color:var(--ink);letter-spacing:0;padding-top:1px}

/* control bar: an explicit 6-column grid, three rows. Silence needs the most width, so it
   gets a line; CC keeps the left edge honest; pause is the hero and takes half of row three. */
.controlbar{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;width:100%;align-items:center}
.adjgroup{display:contents}
.adj{min-width:0;width:100%;display:flex;align-items:center;justify-content:center;gap:2px;height:54px;border:1px solid var(--hairline);border-radius:14px;background:transparent;font:inherit;font-size:calc(13px * var(--type-scale));letter-spacing:.04em;color:var(--muted);transition:border-color var(--ease) .2s,color var(--ease) .2s,box-shadow var(--ease) .2s}
.adj.silence{grid-column:span 4;justify-content:space-between;padding:0 4px 0 14px}
.captoggle{grid-column:span 2;justify-content:center;gap:6px;padding:0 8px;cursor:pointer}
.prevclip{grid-column:span 1}
.rewind{grid-column:span 2}
#pause{grid-column:span 3}
.transport.mini{width:100%;min-width:44px}
.adj-stepper{display:inline-flex;align-items:center;gap:2px}
.adj-label{color:var(--muted)}
.adj-val{color:var(--ink-80);font-variant-numeric:tabular-nums;min-width:2.2em;text-align:center}
.adj-step{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--muted);font:inherit;font-size:calc(21px * var(--type-scale));line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color var(--ease) .2s}
.adj-step:hover{color:var(--ink)}
.adj-step:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:359.98px){
  .adj.silence{padding:0 2px 0 6px}
  .adj-stepper{gap:0}
  .adj-val{min-width:2em}
}
.captoggle .cc{font-weight:500;letter-spacing:.1em;color:var(--muted);transition:color var(--ease) .2s}
.captoggle .cc-state{color:var(--muted);transition:color var(--ease) .2s}
.captoggle:hover{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.captoggle:hover .cc,.captoggle:hover .cc-state{color:var(--ink-80)}
.captoggle.on{border-color:var(--ink)}
.captoggle.on .cc,.captoggle.on .cc-state{color:var(--ink)}
.captoggle:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ── endings ── */
.endings{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.endings .btn{width:100%}
.endnow{position:relative;background:none;border:0;font:inherit;font-size:calc(12.5px * var(--type-scale));letter-spacing:.1em;color:var(--muted);cursor:pointer;padding:4px 10px;transition:color var(--ease) .2s}
.endnow::after{content:'';position:absolute;inset:-10px -6px}
.endnow:hover{color:var(--ink);font-weight:600}
.endnow:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
/* E5.27 — the route back for another round of safety, live for the rest of the defense block.
   Hidden until the capacity gate has gone by, because before that there is nothing to go back to. */
#moresafety{display:none}
#player.more-safety #moresafety{display:block}
/* the open ending owns its own exit: once "I'm done" is up, "Begin ease out" comes down.
   Two buttons that both end the practice, one of them narrating it as a retreat from material
   that no longer exists, is what Justin found on 2026-09-17. */
#player.finishable #easeout{display:none}

/* gentle completion */
.done{display:none;flex-direction:column;align-items:stretch;gap:10px;width:100%;position:relative;z-index:2}
#player.finished .controls{display:none}
#player.finished .choicecard{display:none}
#player.finished .done{display:flex;animation:riseIn .55s var(--ease)}
.done .btn{width:100%}

    add(D.ROLE.pendToDefense, 'pendulating');
    add(D.ROLE.pendToSafety, 'pendulating');
    /* ✅ The landing used to add PEND-SAFETY after the last brief swing — "and back to safety"
     * followed at once by "bring your attention back to the safety experience" (CA review, second
     * pass, 2026-09-17: two safety prompts in a row, drop one). The brief swing is the landing. */
  },
};

/* The prefix. Justin, 2026-09-05: "An Obstacles practice does not run without a skill following
 * it. And the skill is chosen based on the user's mastery level. So they could easily come back
 * to Obstacles again and again to practice I&I, Balancing, and Pendulating."
 *
 * So `obstacles` is not a practice key the planner can build on its own — it is cfg.prefix, and
 * cfg.practice must name the skill it hands into. A bare obstacles practice THROWS rather than
 * emitting activation with nothing to do with it. */
const OBSTACLES_PREFIX = 'obstacles';

/* ── slot 4 · the ADD-ON ──────────────────────────────────────────────────────────
 *
 * ⚠️ Hold & Watch is NOT a practice, and treating it as one is a mistake worth not making. In
 * the shipped player it is a boolean the customizer offers on Balancing and Pendulating only,
 * and it adds one beat to the tail. TAG-MAP agrees — `SETUP-PRACTICE-HOLD-WATCH` is described as
 * "the Hold & Watch tail. Chosen in the customizer." So it is an option on two skills, and it
 * carries its own setup clip.
 *
 * ✅ It is LAST. Proposed as an extrapolation from the balancing ruling plus TAG-MAP's own "the
 * Hold & Watch tail… it runs at the end", then put to Justin as an extrapolation and confirmed
 * by him, 2026-08-31. The shipped player puts it one beat earlier on pendulating, before the
 * final swing to safety — so that is a deliberate change to the player's order. */
const HOLD_WATCH_OFFERED_BY = ['balancing', 'pendulating'];

/* ✅ AND ONLY AT THE DESCRIPTION DEPTH (Justin, 2026-09-05, CA item 7). It used to ride any
 * Balancing or Pendulating, general depth included. Book 3 puts Holding & Watching last in the
 * sequence, asks for "a deep level of safety anchoring", and says the deepest result comes from
 * describing the sensation. So the add-on is offered only once the depth is `description`;
 * asking for it shallower THROWS (E3.19 — a choice the builder cannot honour must not be
 * offerable). */
const HOLD_WATCH_DEPTH = 'description';

/* The whole defense tail, in slot order. This is the one function that knows the grammar.
 *
 * The tail after the skill: BREATH-CHECK, then — with the add-on — IMPULSE-CHECK and HOLD-WATCH,
 * then the close. Two rulings in that order:
 *   • Hold & Watch is the LAST beat before the close (Justin, 2026-08-31). The 09-05 spine put
 *     BREATH-CHECK → CAP-CHECK after it, which broke that; the breath check now comes BEFORE the
 *     hold, and CAP-CHECK moved into Pendulating (see SKILLS.pendulating) where it has a branch.
 *   • IMPULSE-CHECK plays once inside Hold & Watch, before the hold starts (Justin, 2026-09-05,
 *     CA item 16): the hold is exactly where Book 3 expects spontaneous expression — shakes,
 *     trembles, shudders — and the clip that gives permission for them was not there. */
function defenseTail(add, cfg, permitGate, capacityCheck) {
  const prefixed = cfg.prefix === OBSTACLES_PREFIX;
  const skill = SKILLS[cfg.practice];
  defenseBase(add, cfg, prefixed, permitGate);
  depthBlock(add, cfg);
  skill(add, cfg, prefixed, capacityCheck);
  add(D.ROLE.breathCheck, 'defense');
  if (cfg.holdWatch) {
    add(D.ROLE.impulseCheck, cfg.practice);
    add(D.ROLE.holdWatch, cfg.practice);
  }
}

/* Four of the thirty-two, no repeats. The shipped player shuffles at runtime; the choice of
 * WHICH four is not a sequencing decision, so the planner takes them in order unless the
 * caller supplies a dealer. A plan has to be reproducible to be assertable. */
function dealStatements(cfg) {
  const pool = D.FAMILY.obstacleStatements;
  return (cfg.deal || (p => p.slice(0, STATEMENTS_PER_PRACTICE)))(pool.slice());
}
const STATEMENTS_PER_PRACTICE = 4;

/* E3.16 — the first practice ever, then never again.
 *
 * ⚠️ THE SKIP IS ON EVERY BEAT OF THE BLOCK, NOT ONLY THE FIRST — corrected 2026-09-01.
 * ENGINE-CONTRACT E5.34 says "the skip on the first-practice intro stays up for the whole of
 * `INTRO-FIRST-01` AND its gap", and taken literally that is not implementable against the
 * script that was written for it. `INTRO-FIRST-02` is the clip that ANNOUNCES the control —
 * "there is now a skip button on the screen that takes you to the Tiny Practice" — so a skip
 * that has already gone by the time that sentence is read leaves the audio describing
 * something the listener cannot see. That is E5.32 from the other direction.
 *
 * So the control is up for the whole intro block and its gaps, and it skips to the PRACTICE,
 * which is what the clip promises. E5.34's intent survives intact: it is still the low-stakes
 * rehearsal of the tap that matters at the capacity gate, and it is still the only skip in the
 * engine. Flagged to Justin — the contract's wording is the thing to correct, not the script.
 */
function introFirst(add) {
  D.FAMILY.introFirst.forEach(id => add(id, 'opening', { kind: KIND.setup, skippable: true }));
}

// ── the plan builder ────────────────────────────────────────────────────────────────────

/* cfg:
 *   { anchor, practice, mode: 'timed'|'open', type: 'full'|'micro', first, silence,
 *     plain, sense, practiceBlock,
 *     prefix,       // 'obstacles' | undefined — the four spoken lines, ahead of the skill
 *     depth,        // 'general' | 'specific' | 'description' | undefined
 *     holdWatch }   // the add-on
 *
 * `descDefense` is GONE as a config flag: describing defense is the deepest DEPTH, not a
 * separate toggle. `depth: 'description'` is what asks for it.
 */
function plan(cfg) {
  const silence = cfg.silence;
  if (!(silence > 0)) throw new Error('plan(): cfg.silence is required and must be positive');

  const beats = [];
  const branches = {};
  const add = (id, phase, opts = {}) => {
    const reassure = REASSURE_ONCE[id];
    if (reassure && opts.take === undefined && opts.pool === undefined) {
      opts = beats.some(b => b.id === id) ? { ...opts, pool: reassure.later } : { ...opts, take: reassure.first };
    }
    const beat = { id: D.must(id), phase, kind: opts.kind || KIND.beat, ...opts };
    beat.gap = gapFor(beat, silence);
    beats.push(beat);
    return beat;
  };

  if (SHORT_PRACTICES.includes(cfg.practice)) return short(cfg, add, beats, branches);

  const anchor = D.ANCHOR[cfg.anchor];
  if (!anchor) throw new Error(`plan(): unknown anchor ${cfg.anchor}`);

  const safety = SAFETY_LEVELS.find(l => l.practice === cfg.practice);
  const base = BASE_PRACTICES.find(b => b.practice === cfg.practice);
  const skill = SKILLS[cfg.practice];
  const isAnchoring = cfg.practice === ANCHORING;
  const prefixed = cfg.prefix === OBSTACLES_PREFIX;

  /* E3.19, and the 2026-09-05 ruling in one throw. `obstacles` is a PREFIX, not a practice:
   * it generates activation from the four spoken lines and gives the listener nothing to do
   * with it, so it must hand into a skill. A bare obstacles practice is not buildable. */
  if (cfg.practice === OBSTACLES_PREFIX) {
    throw new Error(
      'plan(): obstacles is a prefix, not a practice. An Obstacles practice never runs without ' +
      'a skill after it (Justin, 2026-09-05) — pass { prefix: "obstacles", practice: ' +
      '"imagery" | "balancing" | "pendulating" }.');
  }
  if (cfg.prefix && !prefixed) throw new Error(`plan(): unknown prefix ${cfg.prefix}`);
  if (prefixed && !skill) {
    throw new Error(`plan(): an obstacles prefix must hand into a skill, not ${cfg.practice}`);
  }

  if (!safety && !base && !skill && !isAnchoring) {
    if (typeof cfg.practiceBlock !== 'function') {
      throw new Error(
        `plan(): "${cfg.practice}" is not a practice this planner knows. The safety half comes ` +
        'from TAG-MAP §3b and the defense half is its four-slot grammar; the three skills were ' +
        'read out of the shipped player with harness/seq. Nothing here is inferred — add it ' +
        'from a source or pass a practiceBlock.');
    }
  }
  if (cfg.holdWatch && !HOLD_WATCH_OFFERED_BY.includes(cfg.practice)) {
    // E3.19 — a choice the builder cannot honour must not be offerable.
    throw new Error(`plan(): hold & watch is not offered on ${cfg.practice}`);
  }
  if (cfg.holdWatch && cfg.depth !== HOLD_WATCH_DEPTH) {
    throw new Error(
      `plan(): hold & watch is offered only at the ${HOLD_WATCH_DEPTH} depth (Justin, 2026-09-05), ` +
      `not at ${cfg.depth || 'no depth'}`);
  }
  /* Depth is offered by Balancing and Pendulating, and — for description only — by an
   * obstacles prefix (Justin, 2026-09-05). Imagery has no depth slot of its own. */
  if (cfg.depth && !(DEPTH_OFFERED_BY.includes(cfg.practice)
                     || (prefixed && DEPTH_OFFERED_BY_PREFIX.includes(cfg.prefix)))) {
    throw new Error(`plan(): a depth is not offered on ${cfg.practice}`);
  }
  /* And a skill that HAS a depth slot must be given one. There is no depth-less Balancing:
   * `general` is the shallowest a Balancing practice goes, not the absence of a depth. Without
   * this the practice would emit no body beats at all and swing at a defense it never found —
   * silently, which is the one thing this planner is built not to do. */
  if (DEPTH_OFFERED_BY.includes(cfg.practice) && !cfg.depth) {
    throw new Error(
      `plan(): ${cfg.practice} needs a depth — one of ${DEPTHS.join(', ')}. "general" is the ` +
      'shallowest it goes, not the absence of one.');
  }
  const level = safety || { level: 1, practice: null };
  const side = (base || skill) ? 'defense' : 'safety';

  // 0 · openers — INTRO, anchor prep, practice setup, mode, intention (§3b spine) ────────
  if (cfg.first) introFirst(add);
  else add(D.ROLE.intro, 'opening', { kind: KIND.setup });

  add(anchor.setup, 'opening', { kind: KIND.setup });

  /* Every level plays the half-opener first, and the level's own clip continues its
   * sentence. Safety level 1 has no second clip — connection is the whole practice, so the
   * half-opener is the whole announcement. */
  add(side === 'defense' ? D.ROLE.halfOpenerDefense : D.ROLE.halfOpenerSafety, 'opening', { kind: KIND.join });
  /* The setup chain, §3b: half-opener → [prefix] → the practice's own clip → [depth] →
   * [add-on]. ⚠️ The obstacles PREFIX clip's position in that chain is the one placement here
   * not read from a source: SETUP-PRACTICE-OBSTACLES announces the four spoken lines, which
   * come first, so it is announced first. Flagged for Justin. */
  /* ✅ UNDER A PREFIX THE SETUP NAMES BOTH HALVES IN ONE CLIP (Justin, 2026-09-05, CA item 6:
   * Obstacles reappears before each skill, "but the setup should also inform the user what the
   * practice is"). SETUP-PRACTICE-OBSTACLES was written for Obstacles → Imagery & Invitation —
   * "validate it, normalize it, and then invite it to be with us" — so it stays that clip's
   * announcement; SETUP-PRACTICE-OBSTACLES-BALANCING and -PENDULATING announce the other two
   * routes. One clip per route, and the skill's own setup clip does NOT also play: "It utilizes
   * Obstacles, and then Balancing" followed by "It utilizes the Balancing skill" would announce
   * the practice twice. The depth clip still follows, because the prefix clips say nothing
   * about the body. */
  if (prefixed) {
    add(D.practices()[OBSTACLES_SETUP[cfg.practice]].setup, 'opening', { kind: KIND.setup });
  } else {
    const own = level.practice || cfg.practice;
    if (own && D.practices()[own]) add(D.practices()[own].setup, 'opening', { kind: KIND.setup });
  }

  /* The depth carries its own setup clip — SETUP-PRACTICE-GENERAL/SPECIFIC/DESCRIBE-DEFENSE.
   * Those three were written as standalone "defense level 3/4/5" practices; new, skill-agnostic
   * DRAFT copy landed in the script 2026-09-05 for Justin to edit. The clips are not cut. */
  if (cfg.depth) add(D.practices()[DEPTH_SETUP[cfg.depth]].setup, 'opening', { kind: KIND.setup });

  /* Hold & Watch carries its own setup clip. §3b does not say where it goes and the shipped
   * player has no such clip, so it is placed with the practice it modifies rather than guessed
   * into the tail — it is a SETUP-PRACTICE-* clip and this is the setup run. Flagged in the
   * README as the one placement here that is not read from a source. */
  if (cfg.holdWatch) add(D.practices()[HOLD_WATCH].setup, 'opening', { kind: KIND.setup });

  if (cfg.mode === 'open') add(D.ROLE.setupModeOpen, 'opening', { kind: KIND.setup });
  /* ✅ THE INTENTIONAL BREATH IS THE FIRST BEAT AFTER THE SETUP (CA review 2026-09-17, applied on
   * Justin's direction): the builder's rule is that the breath comes before "choose a non-safety
   * emotion", not after it. It used to open the mindfulness run instead. */
  add(D.ROLE.arriveBreath, 'opening');
  /* ✅ READING 1 OF 2 (3 in defense work) — right after the intentional breath and BEFORE the
   * non-safety emotion is chosen (CA review, second pass, 2026-09-17): picking one can lower
   * safety, so the opening number has to be taken before it. It used to open the warm-up. */
  add(D.SAFETY_READING, 'opening');
  /* INTENT-SET plays for EVERY self-regulation practice — the three skills AND the two base
   * practices — and never under an obstacles prefix. Justin, 2026-09-05: "it's picking an
   * emotion to pay attention to at the outset. It's very intentional planning. It would not
   * make sense to play this with Obstacles." Under a prefix the emotion is not chosen in
   * advance — it arrives from the statements.
   *
   * ✅ 2026-09-16, device walk 1: the base practices had been left out ("they never invite
   * anything in"), which left INTENT-TOLERABLE below referring to a choice nobody was asked to
   * make — Justin heard "whatever you chose…" with nothing chosen. His ruling: "intent-set
   * should play for all self-reg practices except obstacles." */
  /* ✅ Takes A and C each read a sentence twice in one breath (CA review 2026-09-17), so the
   * shuffle leaves them out until they are re-cut. */
  if ((skill && !prefixed) || base) add(D.ROLE.intentSet, 'opening', { pool: poolExcluding(D.ROLE.intentSet, INTENT_SET_DOUBLED) });
  /* ✅ WHICH DEFENSE TO BRING — INTENT-TOLERABLE (Justin, 2026-09-05, CA item 10). The engine
   * titrates how deep a practice goes and said nothing about what the listener brings, so a
   * first-ever defense practice could arrive carrying stuck shame and be validated without a
   * word about scale. The guidance is TOLERABLE, not mild — Justin: "the person should be
   * expanding their tolerance and challenge level, not maintaining the lowest level."
   *
   * It plays wherever INTENT-SET plays, right after it — since 2026-09-16 that includes the two
   * base practices. Not under an Obstacles prefix: there the emotion is not chosen in advance,
   * it arrives from the statements. Once per practice. */
  if ((skill && !prefixed) || base) add(D.ROLE.intentTolerable, 'opening');

  // 1 · the warm-up — a LIGHT pass, because every long practice anchors ──────────────────
  /* ✅ REWRITTEN 2026-09-17 on the Curriculum Advisor's review, at Justin's direction ("I got
   * this wrong previously. Follow this directive."). Two things changed:
   *
   *   1. The senses run OUTSIDE-IN — sight → sound → touch (Justin's 2026-09-07 ruling), not the
   *      MIND-03…05 numbering (sound → touch → sight) this file used to play.
   *   2. An anchoring practice does NOT get the full mindfulness run. The builder opens with a
   *      light look at sight and sound, then the breath, then the emotion pair ("Imagine &
   *      Invite"), then the anchor. The full run — every sense with a breath re-check after each —
   *      belongs to the practices that do NOT anchor, "so nothing doubles up". In the app it
   *      doubled up: MIND-04 is the whole touch prompt, and then the touch ladder asked again.
   *      Counting the setup clip, people were asked to find something to hold three times.
   *
   * The 0–10 reading is the first thing after the intentional breath (see the opening; since the
   * second pass it comes before INTENT-SET) and the second reading of the old design (before the
   * ladder) is gone: Justin, 2026-09-17: "0–10 for
   * safety should occur twice: at the beginning and before the impulse check; in defense work it
   * can occur again at the end." See the gate run below for the other two.
   *
   * The sound anchor looks at sound twice (warm-up, then its ladder); Justin: "double sound is
   * fine since it's brief and different levels of attention." */
  const mind = D.FAMILY.mind;
  WARM_UP_SENSES.forEach(i => add(mind[i], 'mindfulness'));      // sight, sound — outside-in
  add(D.NATURAL_BREATH, 'mindfulness');                          // then the breath
  add(mind[MIND_EMOTION], 'mindfulness');                        // Imagine & Invite
  add(mind[MIND_INVITE], 'mindfulness');

  // 2 · the anchor ladder, the shared tail, the running level's safety beats ────────────
  /* 🔴 THE HAND-OFF COMES BEFORE THE SHARED TAIL. Corrected 2026-09-05 against TAG-MAP §3b
   * (fixed there in 3cc07a2). This file emitted rungs → shared tail → safety beats → hand-off,
   * which reads the anchor's last clip after the practice has already moved on. §3b's spine is:
   *
   *     ANCHORING-<ANCHOR>-01 … (n-1)
   *     ANCHORING-<ANCHOR>-(n)        the hand-off — its last line cues the breath beat below
   *     ANCHORING-SHARED-01-BREATH … 04-CONNECT   ← base Anchoring ends here
   *     <the running level's safety beats>
   *
   * The copy is the proof: ANCHORING-TOUCH-05 take B ends "…as we shift focus to your breath
   * again", and ANCHORING-SHARED-01-BREATH is that breath beat. */
  const rungs = anchor.ladder.slice(0, -1);
  const handoff = anchor.ladder[anchor.ladder.length - 1];
  rungs.forEach(id => add(id, 'anchoring'));
  add(handoff, 'anchoring');
  D.FAMILY.sharedTail.forEach(id => add(id, 'safety'));   // base Anchoring ends here

  /* Cumulative: a level plays every level below it first. A defense-side practice — ladder
   * level or named — runs the WHOLE safety half regardless of its own defense level. */
  const throughLevel = skill ? SAFETY_HALF_LEVEL : (base ? BASE_THROUGH_LEVEL : level.level);
  let rewindTarget = null;
  SAFETY_LEVELS.filter(l => l.level <= throughLevel).forEach(l => {
    l.beats(cfg.plain).forEach(id => {
      const b = add(id, 'safety');
      if (id === D.ROLE.bodyGeneralSafety) rewindTarget = b;   // E5.27 — the more-safety target
    });
  });

  /* 🔴 NO CAP-CHECK HERE. Removed 2026-09-05. This file placed one at the end of the spine,
   * which breaks TAG-MAP §7 twice over: rule 7 — "never place a check whose question has no
   * consequence… if the next beat is a close, the practice has asked something it then ignores"
   * (that is every safety-side practice) — and rule 8 — "never within two beats of INTEREST-01
   * or CAP-GATE-DEFENSE" (that is every defense-side one, where the curiosity gate is the very
   * next beat). §3b's corrected spine does not carry it. */

  // 3 · the gate and the defense tail ───────────────────────────────────────────────────
  /* E5.26 — a "no" hands into the ease-out and then the close; a "yes" continues. Doing
   * nothing continues the practice, safely assuming an internal yes (Justin, 2026-08-11):
   * the internal answer is the real event, the tap is optional telemetry. */
  /* 🔴 CAP-GATE-DEFENSE IS RETIRED (Justin, 2026-09-17). It asked "do you have the capacity and
   * the genuine willingness to go there right now?" five beats after INTEREST-01 asked "do you feel
   * interest or curiosity about your non-safety experiences?", and both offered an exit. Two
   * capacity questions a clip apart is §7 rule 7, the same fault this engine was built to end.
   *
   * Its two jobs were split rather than dropped:
   *   • "are you up for this?"      → INTEREST-01, which already asks it and asks it better.
   *   • the more-safety REWIND      → PERMIT-DEFENSE, below — the question the person is already
   *                                    being asked, whose "no" means exactly "go back for safety".
   * Catching someone who is actually in trouble moves to the 0–10 readings (a drop into the Low
   * band, and INTENSITY-DEFENSE at 7+), which fire on a number the person just reported instead of
   * on a generic question at a fixed point. Justin, 2026-09-17: "we need a whole new strategy for
   * catching someone in trouble with new audio" — that audio is v3 and is NOT in this build, so
   * until it lands the readings are still plain beats and INTEREST-01 is the only spoken check.
   *
   * The clip stays recorded and in the manifest; it is parked in `data.js` DELIBERATE_REUSABLES
   * exactly as STOP-OK is, and the roadmap decides its future. */
  const permitGate = () => {
    /* E5.28's rule, inherited: the question must be answerable, with the targets up for the whole
     * clip AND the silence after it (E4.23). Doing nothing continues — the internal answer is the
     * real event and the tap is optional telemetry (Justin, 2026-08-11).
     * E5.31 — two targets is the ceiling, and "yes" and "no" are exactly two. */
    const permit = add(D.ROLE.permitDefense, 'defense', { choice: 'permit' });
    if (!rewindTarget) throw new Error('plan(): the permit gate offers a rewind with no target beat');
    branches[permit.id] = {
      /* "yes" is not listed: it routes nowhere and changes nothing, which is what continuing IS.
       * Listing it would promise a consequence the builder does not have. */
      no: REWIND_TO(rewindTarget.id),
    };
    /* ✅ NO STOP-OK AFTER THE GATE (CA review, second pass, 2026-09-17; Justin: "I agree on
     * this"). The gate already says staying with safety is a complete practice and its buttons
     * are the way to stop; "just say I'm done" does not fit a tap. Later the same day Justin
     * took it out of the base practices too — STOP-OK plays nowhere until the roadmap says. */
  };

  /* The mid-Pendulating re-read of the Interest Impulse: CAP-CHECK with ONE target, the spoken
   * "no", which eases out exactly as the axis gate's "no" does. See SKILLS.pendulating. */
  const capacityCheck = () => {
    const check = add(D.ROLE.capCheck, 'gate', { choice: 'capacity-check' });
    branches[check.id] = { no: EASE_OUT_SPOKEN };
  };

  /* ── the axis gate ────────────────────────────────────────────────────────────────
   *
   * INTEREST-01 — the Interest Impulse. Everything before it is connecting with safety;
   * everything after it is connecting with defense. Renamed from the old curiosity-gate ID on
   * 2026-09-05. ⚠️ It is an IMPULSE the listener learns to read, not a skill — never call it
   * "the Interest Impulse skill" anywhere the app names it (Justin, 2026-09-05, CA item 3).
   *
   * The Interest Impulse practice plays it as its last beat and then closes; every defense
   * practice plays it as the threshold.
   *
   * ✅ TAKE E IS PINNED TO THE INTEREST IMPULSE PRACTICE, AND EXCLUDED EVERYWHERE ELSE (Justin,
   * 2026-09-05, CA item 1). Takes A–C promise a turn — "we're going to turn our attention to
   * non-safety now" — and in that practice there is no turn: the close is next, so three times in
   * four the top of the safety half announced a destination it then skipped (§7 rule 9). Take E
   * asks the question, says answering it is the practice, and says plainly that we are not going
   * forward into defense. So it is the ONLY take there, and it never plays inside a defense
   * practice, where its "we're not turning toward the non-safety" would be the opposite lie. */
  /* ✅ READING 2 OF 2 — immediately before the Interest Impulse question, whoever asks it
   * (Justin, 2026-09-17). In the Interest Impulse practice that is after describing safety, which
   * is the before-and-after the CA asked for; in the defense practices it is the number the
   * listener carries into the question. */
  const readingBeforeInterest = cfg.practice === INTEREST_SAFETY || base || skill;
  if (readingBeforeInterest) add(D.SAFETY_READING, 'gate');
  if (cfg.practice === INTEREST_SAFETY) {
    /* ✅ THE ANSWER IS RECORDED (Justin, 2026-09-05, CA item 2: "yes to A"). The yes/no control
     * stays up, and the answer — with the date — is what the app uses to offer the first defense
     * practice. Both targets route to the same place: nowhere in the practice (the close is next
     * either way) and into the session record. That is the one §7 rule 7 exception, and the
     * consequence lives outside the practice on purpose. */
    const interest = add(D.ROLE.interestGate, 'gate', { choice: 'interest-answer', take: INTEREST_SAFETY_TAKE });
    branches[interest.id] = { yes: RECORD_INTEREST('yes'), no: RECORD_INTEREST('no') };
  } else if (base || skill) {
    const interest = add(D.ROLE.interestGate, 'gate', {
      choice: 'interest', pool: poolExcluding(D.ROLE.interestGate, [INTEREST_SAFETY_TAKE]),
    });
    branches[interest.id] = { no: EASE_OUT_SPOKEN };
  }

  if (base) {
    /* The base as a practice in its own right, at two depths: validate alone, and validate →
     * normalize. Both stop before PERMIT-DEFENSE and go straight to the close — they never
     * invite anything in, so there is nothing to permit. §3b: "everything builds off validate →
     * normalize."
     *
     * ✅ NO CAPACITY GATE HERE (Justin, 2026-09-05): "CAP-GATE-DEFENSE and STOP-OK are probably
     * too much for this practice." A Validate practice used to spend THREE permission beats —
     * interest, capacity, stop — to reach one instruction, and both of the extra two offered a
     * choice whose branches landed a single clip apart. §7 rule 7, twice. INTEREST-01 is the gate.
     *
     * ✅ BUT STOP-OK PLAYS ONCE, AFTER THE BASE PAIR COMPLETES (Justin, 2026-09-05, CA item 13,
     * placement corrected the same day on the CA's follow-up). With it gone from here it played
     * only in Balancing and Pendulating, so the person who most needed to hear "you can stop" —

/* ── dual load (browser + Node) ────────────────────────────────────────────────────────────
 * `data.js` has always exported both ways; the rest of the engine was CommonJS only, which is
 * fine for the test suites and useless to a page. `practice-engine.html` is BUILT by inlining
 * these files verbatim (harness/build-practice-engine.py), so the bytes the browser runs are
 * the bytes the suites ran — that only works if the same file can be required AND scripted.
 * Node takes the require(); a browser takes the global the sibling file published. */
const D = (typeof require === 'function')
  ? require('./data.js')
  : (typeof window !== 'undefined' ? window : globalThis).SNB_ENGINE_DATA;

/* Constants, all read out of the shipped player rather than chosen here. A number in this
 * block is evidence from a device log; changing one is a behaviour change, not a tidy-up. */
const C = Object.freeze({
  /* §A4.2 — ONE continuous playback of ONE 30-second silent file, cut short by position.
   * v1 used a per-gap data: URI and v2 replayed a 1-second file N times; both made the iOS
   * lock-screen glyph flicker, and a play tap landing mid-swap killed the practice. */
  SILENCE_SRC: 'clips/silence-30s.wav',
  SILENCE_FILE_SECONDS: 30,

  /* Where the takes live. ONE constant, `data.js`'s `CLIP_FOLDER`, and every take URL is
   * built by `D.clipUrl(base, file)` — never by hand here. History: `fileFor()` returns a
   * bare `ID-a.mp3`, so with `base` set to the app root every clip resolved beside index.html
   * and 404ed, while the gap alone was found (caught wiring the page, 2026-09-01; asserted
   * in runtime.test.js). 2026-09-16: for the beta device walk the folder is the LIVE site's
   * `clips-v2/` (absolute, cross-origin), while the silent file above stays app-relative —
   * `clips-v2/` has no silence file and `clips/silence-30s.wav` exists on both branches. At
   * cutover `CLIP_FOLDER` returns to `clips/` and the two share a prefix again. */
  CLIPS_DIR: D.CLIP_FOLDER,

  /* §A4.6 — a `pause` event only counts as external if it STICKS this long... */
  EXTERNAL_PAUSE_DEBOUNCE_MS: 350,
  /* ...and was not something we did in this window. Every deliberate src swap and every
   * transport action stamps `_lastSelfCtl`. Without it, the lock-screen play button paused
   * us right back: au.play() is async, so for a moment our `paused` is false while the
   * element's is still true, and the watchdog read that gap as the OS pausing us. */
  SELF_CONTROL_WINDOW_MS: 1200,

  PLAY_RETRY_MS: 350,
  PLAY_MAX_TRIES: 3,
  ERROR_SKIP_MS: 300,        // a clip that fails to load skips forward; it never freezes
  ERROR_TROUBLE_AT: 2,       // two consecutive failures surface the conn-trouble state
  ERROR_TROUBLE_RESET_MS: 6000,

  /* §A4.9 — poll interval while a shell update waits for the practice to end. */
  RELOAD_POLL_MS: 2000,

  PREFETCH_CAP: 24,          // Audio objects held at once
  PREFETCH_AHEAD: 2,         // beats warmed ahead of the playhead

  MIN_GAP_SECONDS: 0.4,      // shorter than this is not a gap; go straight on
});

const TAKE_LETTERS = 'abcdefghijklmnopqrstuvwxyz';

/* ── the device port ──────────────────────────────────────────────────────────────────────
 * Everything the runtime is allowed to know about the world. A port that omits a piece gets
 * an inert stand-in, so a runtime can be built for a browser with no MediaSession and no
 * service worker without branching all over the transport.
 */
function portOf(device) {
  if (!device || !device.audio) {
    throw new Error('runtime(): a device port with an `audio` facade is required. See browser-device.js.');
  }
  const timers = device.timers || {};
  return {
    audio: device.audio,
    isHidden: device.isHidden || (() => false),
    onVisibilityChange: device.onVisibilityChange || (() => () => {}),
    mediaSession: device.mediaSession || null,
    serviceWorker: device.serviceWorker || null,
    prefetcher: device.prefetcher || null,
    now: device.now || (() => Date.now()),
    setTimeout: timers.setTimeout || ((f, ms) => setTimeout(f, ms)),
    clearTimeout: timers.clearTimeout || (id => clearTimeout(id)),
    setInterval: timers.setInterval || ((f, ms) => setInterval(f, ms)),
    clearInterval: timers.clearInterval || (id => clearInterval(id)),
    random: device.random || Math.random,
    base: device.base || '',
  };
}

class Runtime {
  constructor({ plan, device, onEvent }) {
    if (!plan || !Array.isArray(plan.beats) || !plan.beats.length) {
      throw new Error('runtime(): a plan with beats is required. Build one with plan.js.');
    }
    this.plan = plan;
    this.beats = plan.beats;
    this.dev = portOf(device);
    this.onEvent = onEvent || (() => {});

    this.idx = -1;
    this.playing = false;
    this.paused = false;
    this.finished = false;

    /* A beat keeps the reading it was dealt. `fileFor()` shuffles across a clip's takes, and
     * until 2026-09-16 it was rolled again on every play — so "back" (previousBeat, the lock
     * screen's previoustrack) replayed the same beat in DIFFERENT words. Justin, device walk 1:
     * "when I went back to relisten, the audio clip changed to another one." Keyed by the beat
     * object, so the two BREATH-CHECK beats in a defense practice still get their own roll. */
    this._dealt = new WeakMap();
    this._trimStart = 0;            // data.js TAKE_TRIMS — where the current take begins
    this._trimEnd = 0;              // …and where it is cut, by position (0 = play to `ended`)

    this.inGap = false;
    this._inSilence = false;      // a gap is REAL AUDIO, not a timer — §A4.2
    this._gapSecs = 0;            // where in the silent file this gap ends
    this._gapRemainMs = 0;        // only the fallback timer path uses this — §A4.3
    this._gapTimer = null;
    this._usingFallbackGap = false;

    this._endedWhilePaused = false;   // §A4.7 — a debt, settled on resume
    this._lastSelfCtl = 0;            // §A4.6
    this._tapArmed = false;
    this._pendingTapRearm = false;    // §A4.8 — deferred to the next visibilitychange
    this._errCount = 0;
    this._errTimer = null;
    this.connTrouble = false;

    this._swReloaded = false;
    this._swPendingReload = false;
    this._swPoll = null;

    this._wire();
  }

  // ── wiring ────────────────────────────────────────────────────────────────────────────

  _wire() {
    const au = this.dev.audio;

    /* §A4.1 — advance on `ended`, NEVER on a duration table. `DUR` was taken out of the
     * timing path because clips were hard-cut at their table length and longer takes bled
     * into the silence. The media element is the only authority on when a clip is over. */
    au.addEventListener('ended', () => this._onEndedEvent());

    /* §A4.2 — and the gap ends HERE, on position, not on `ended` and not on a timer.
     * `timeupdate` is a media event, so it keeps firing with the screen locked. A
     * `setTimeout` gap did not: iOS suspends JS timers on a locked screen, and the practice
     * died at the first silence with the screen off. */
    au.addEventListener('timeupdate', () => {
      if (!this.playing || this.paused) return;
      /* a trimmed take ends here, by position — the same media-driven cut as the gap,
       * so it survives a locked screen; `ended` would come seconds later at the file's end */
      if (this._trimEnd && !this._inSilence && au.currentTime >= this._trimEnd) {
        this._trimEnd = 0;
        this._lastSelfCtl = this.dev.now();
        return this._onEnded();
      }
      if (!this._inSilence) return;
      if (au.currentTime >= this._gapSecs) {
        this._inSilence = false;
        this.inGap = false;
        this._advance();
      }
    });

    au.addEventListener('error', () => this._onError());

    /* §A4.6 — the external-pause watchdog. Clip ends and src swaps also fire `pause`, so
     * only a pause that is still in effect after the debounce, and that we did not cause
     * inside the self-control window, is treated as the OS pausing us. */
    au.addEventListener('pause', () => {
      if (au.ended) return;
      this.dev.setTimeout(() => {
        if (this.dev.now() - this._lastSelfCtl < C.SELF_CONTROL_WINDOW_MS) return;
        if (!this.playing || this.paused || this.inGap || this.finished) return;
        if (!au.paused || au.ended) return;
        this._setPaused(true, 'external');
      }, C.EXTERNAL_PAUSE_DEBOUNCE_MS);
    });

    /* §A4.5 — WebKit owns pause and resume from the lock screen (see _initMediaSession), so
     * we MIRROR what it does rather than driving it. A play we did not initiate means the
     * person pressed play on the lock screen; any owed advance settles right there. */
    au.addEventListener('play', () => {
      if (!this.playing || this.finished) return;
      if (!this.paused) return;
      this._setPaused(false, 'external');
      if (this._endedWhilePaused) { this._endedWhilePaused = false; this._onEnded(); }
    });

    this._initMediaSession();
    this._initServiceWorker();

    this._offVisibility = this.dev.onVisibilityChange(() => this._onVisibilityChange());
  }

  /* §A4.5 — no `play`/`pause` action handlers, deliberately, and measured rather than
   * guessed. With handlers registered we called au.pause()/au.play() ourselves; on iOS a
   * JS-initiated pause in the background tears the audio session down and a JS-initiated
   * play CANNOT bring it back — the promise resolves, `playing` fires, and currentTime
   * stays frozen until the page is foregrounded. With the handlers null, WebKit performs
   * the transport on the element itself and keeps its own audio session, which is the only
   * path that works off-screen.
   *
   * `seekbackward` and `previoustrack` ARE wired: the lock screen is a real remote.
   * `nexttrack` is null on purpose — a practice is a sequence to be walked, not skipped
   * forward through. */
  _initMediaSession() {
    const ms = this.dev.mediaSession;
    if (!ms || !ms.setActionHandler) return;
    try {
      ms.setActionHandler('play', null);
      ms.setActionHandler('pause', null);
      ms.setActionHandler('nexttrack', null);
      ms.setActionHandler('seekbackward', () => this.rewind());
      ms.setActionHandler('previoustrack', () => this.previousBeat());
    } catch (e) { /* a browser without MediaSession is not a failure */ }
  }

  _msState(state) {
    const ms = this.dev.mediaSession;
    if (ms) { try { ms.playbackState = state; } catch (e) {} }
  }

  /* §A4.9 — the disappearing-practice bug. An unconditional reload on `controllerchange`
   * destroyed live practices, and a session is only reported at the end, so the practice
   * was not paused — it was gone, and unrecorded. A shell update is never urgent enough to
   * end someone's practice: hold it until they are done. */
  _initServiceWorker() {
    const sw = this.dev.serviceWorker;
    if (!sw || !sw.onControllerChange) return;
    sw.onControllerChange(() => this._reloadWhenSafe());
  }

  _inPractice() { return this.playing && !this.finished; }

  _reloadWhenSafe() {
    const sw = this.dev.serviceWorker;
    if (!this._inPractice()) return this._reloadNow();
    if (this._swPendingReload) return;
    this._swPendingReload = true;
    this.onEvent({ type: 'reload-deferred' });
    this._swPoll = this.dev.setInterval(() => {
      if (!this._inPractice()) {
        this.dev.clearInterval(this._swPoll);
        this._swPoll = null;
        this._reloadNow();
      }
    }, C.RELOAD_POLL_MS);
  }

  _reloadNow() {
    if (this._swReloaded) return;
    this._swReloaded = true;
    this.onEvent({ type: 'reload' });
    const sw = this.dev.serviceWorker;
    if (sw && sw.reload) sw.reload();
  }

  // ── the beats ─────────────────────────────────────────────────────────────────────────

  beat() { return this.beats[this.idx] || null; }

  /* A beat names a clip; the take is chosen here. The short practices pin their sign-off to
   * take A — the only pinned take in the system — so a shuffle-everything change must not
   * be able to swallow it. That is why the beat carries `take` and this is the one place
   * that reads it. */
  fileFor(beat) {
    const n = D.takes(beat.id);
    if (beat.take) {
      const i = TAKE_LETTERS.indexOf(beat.take);
      if (i < 0 || i >= n) {
        throw new Error(`runtime(): ${beat.id} has no take "${beat.take}" (it has ${n}).`);
      }
      return D.fileFor(beat.id, beat.take);
    }
    /* A beat may restrict the shuffle to a POOL of takes (2026-09-05): INTEREST-01's take E is
     * written for the Interest Impulse practice alone and must never play inside a defense
     * practice, so those beats carry every take but E. Same shape as `take`, same one reader. */
    if (beat.pool) {
      const bad = beat.pool.find(t => TAKE_LETTERS.indexOf(t) < 0 || TAKE_LETTERS.indexOf(t) >= n);
      if (bad !== undefined || !beat.pool.length) {
        throw new Error(`runtime(): ${beat.id} has no take "${bad}" in its pool (it has ${n}).`);
      }
      const j = Math.floor(this.dev.random() * beat.pool.length) % beat.pool.length;
      return D.fileFor(beat.id, beat.pool[j]);
    }
    const i = Math.floor(this.dev.random() * n) % n;
    return D.fileFor(beat.id, TAKE_LETTERS[i]);
  }

  /* the reading this beat plays — dealt once, on first play, and kept for every replay */
  dealtFile(beat) {
    let f = this._dealt.get(beat);
    if (!f) { f = this.fileFor(beat); this._dealt.set(beat, f); }
    return f;
  }

  variantsOf(beat) {
    const n = D.takes(beat.id);
    return Array.from({ length: n }, (_, i) => D.fileFor(beat.id, TAKE_LETTERS[i]));
  }

  // ── transport ─────────────────────────────────────────────────────────────────────────

  start() {
    this.playing = true;
    this.paused = false;
    this.finished = false;
    this.idx = -1;
    this._advance();
    return this;
  }

  _advance() {
    if (!this.playing || this.finished) return;
    this.idx += 1;
    if (this.idx >= this.beats.length) return this._finish();
    this._playCurrent();
  }

  _playCurrent() {
    const beat = this.beat();
    if (!beat) return this._finish();
    const au = this.dev.audio;
    /* the src swap fires a `pause` event; that is us, not the OS — §A4.6 */
    this._lastSelfCtl = this.dev.now();
    this._inSilence = false;
    this._endedWhilePaused = false;   // whatever was owed, we are past it
    /* a trimmed take (data.js TAKE_TRIMS) starts at `start` — a media fragment AND a seek,
     * so it holds on iOS as well as Chromium — and is cut at `end` by position, in the
     * timeupdate watcher below, exactly as the silent gap file is (§A4.2) */
    const file = this.dealtFile(beat);
    const trim = D.trimFor(file);
    this._trimStart = (trim && trim.start) || 0;
    this._trimEnd = (trim && trim.end) || 0;
    try {
      au.src = D.clipUrl(this.dev.base, file) + (this._trimStart ? '#t=' + this._trimStart : '');
      au.currentTime = this._trimStart;
      this._msState('playing');
      this._tryPlay(() => this.armTapToStart());
    } catch (e) {
      this.armTapToStart();
    }
    this.onEvent({ type: 'beat', id: beat.id, index: this.idx, src: au.src });
    this._prefetchAhead();
  }

  /* Autoplay can be refused. Retry a couple of times, then fall back to a tap — except
   * while hidden, where retrying only produces AbortError storms because iOS will not start
   * media in the background at all. Try once and wait for the screen to come back. */
  _tryPlay(onFail) {
    const au = this.dev.audio;
    let tries = 0;
    const go = () => {
      if (this.dev.isHidden()) tries = C.PLAY_MAX_TRIES - 1;
      try {
        const pr = au.play();
        if (pr && pr.catch) {
          pr.catch(() => {
            (++tries < C.PLAY_MAX_TRIES)
              ? this.dev.setTimeout(go, C.PLAY_RETRY_MS)
              : (onFail && onFail());
          });
        }
      } catch (e) {
        (++tries < C.PLAY_MAX_TRIES)
          ? this.dev.setTimeout(go, C.PLAY_RETRY_MS)
          : (onFail && onFail());
      }
    };
    go();
  }

  /* §A4.8 — NEVER arm tap-to-start while the page is hidden. On a locked screen there is no
   * pointer to tap with, so arming parked the practice forever behind a prompt the person
   * could not see or answer. Defer to the next visibilitychange and just try again. */
  armTapToStart() {
    if (this.dev.isHidden()) {
      this._pendingTapRearm = true;
      this.onEvent({ type: 'tap-deferred' });
      return;
    }
    if (this._tapArmed) return;
    this._tapArmed = true;
    this.onEvent({ type: 'tap-armed' });
  }

  tap() {
    if (!this._tapArmed) return;
    this._tapArmed = false;
    this._tryPlay(() => this.armTapToStart());
  }

  /* §A4.4 — visibilitychange decides NOTHING about audio. The app used to click its own
   * pause button when the page hid; that WAS the lock-screen bug. `hidden` cannot tell a
   * screen lock from an app switch, and a guided practice is exactly the case where audio
   * should keep playing with the screen off — eyes closed, phone down, screen dark. The
   * only things that happen here are recoveries. */
  _onVisibilityChange() {
    if (this.dev.isHidden()) return;
    if (this._pendingTapRearm) {
      this._pendingTapRearm = false;
      if (this.playing && !this.paused) this._tryPlay(() => this.armTapToStart());
    }
  }

  // ── gaps ──────────────────────────────────────────────────────────────────────────────

  /* §A4.2 — the gap is real audio. One continuous playback of one 30-second silent file,
   * cut short at `_gapSecs` by the timeupdate watcher wired in _wire(). The element never
   * pauses mid-gap, so the lock-screen glyph holds still and there is no half-swapped
   * source for a lock-screen tap to land on. */
  _playGap(seconds) {
    const secs = Math.max(0, seconds || 0);
    if (secs < C.MIN_GAP_SECONDS) { this.inGap = false; return this._advance(); }

    const au = this.dev.audio;
    this.inGap = true;
    this._usingFallbackGap = false;
    this._gapRemainMs = secs * 1000;
    this._lastSelfCtl = this.dev.now();
    this._inSilence = true;
    this._gapSecs = secs;
    this._trimEnd = 0;               // the gap file is never a trimmed take
    this.onEvent({ type: 'gap', seconds: secs, index: this.idx });
    try {
      if (!/silence-30s\.wav$/.test(au.src || '')) au.src = this.dev.base + C.SILENCE_SRC;
      au.currentTime = 0;
      this._msState('playing');
      this._tryPlay(() => this._silFallback(secs * 1000));
    } catch (e) {
      this._silFallback(secs * 1000);
    }
  }

  /* §A4.3 — if the silent clip will not play at all, keep the old timer path so failure
   * degrades instead of freezing. This is the path that dies on a locked screen, which is
   * exactly why it is the fallback and not the mechanism. */
  _silFallback(ms) {
    this._inSilence = false;
    this._usingFallbackGap = true;
    this.dev.clearTimeout(this._gapTimer);
    this.onEvent({ type: 'gap-fallback', ms });
    this._gapTimer = this.dev.setTimeout(() => {
      this.inGap = false;
      this._usingFallbackGap = false;
      this._advance();
    }, ms);
  }

  // ── ends, errors and the debt ─────────────────────────────────────────────────────────

  /* §A4.7 — a clip that ends while paused. This handler used to `return` on `paused` and
   * throw the event away, so the sequence never advanced and the practice was stranded on a
   * finished clip; resuming then called play() on an ALREADY-ENDED element, which restarts
   * that same clip from the top. Remember the debt, settle it on resume. */
  _onEndedEvent() {
    if (!this.playing) return;
    if (this.paused) { this._endedWhilePaused = true; return; }
    this._onEnded();
  }

  _onEnded() {
    if (this._inSilence) {           // the silent file ran out before we cut it
      this._inSilence = false;
      this.inGap = false;
      return this._advance();
    }
    if (this.idx >= this.beats.length - 1) return this._finish();
    this._playGap(this.beat().gap);
  }

  /* A clip that fails to load skips forward after a short beat rather than freezing; two
   * consecutive failures say so gently instead of leaving the listener in unexplained
   * silence. */
  _onError() {
    if (!this.playing || this.paused) return;
    this._errCount += 1;
    this.dev.clearTimeout(this._errTimer);
    if (this._errCount >= C.ERROR_TROUBLE_AT) {
      this.connTrouble = true;
      this.onEvent({ type: 'conn-trouble' });
    }
    this._errTimer = this.dev.setTimeout(() => { this._errCount = 0; }, C.ERROR_TROUBLE_RESET_MS);

    if (this._inSilence) { this._inSilence = false; return this._silFallback(this._gapRemainMs || C.ERROR_SKIP_MS); }
    if (this.idx >= this.beats.length - 1) return this._finish();
    this.inGap = true;
    this.dev.clearTimeout(this._gapTimer);
    this._gapTimer = this.dev.setTimeout(() => { this.inGap = false; this._advance(); }, C.ERROR_SKIP_MS);
  }

  _finish() {
    this.playing = false;
    this.finished = true;
    this.inGap = false;
    this._inSilence = false;
    this._endedWhilePaused = false;
    this.dev.clearTimeout(this._gapTimer);
    try { this.dev.audio.pause(); } catch (e) {}
    this.onEvent({ type: 'complete', terminates: this.plan.terminates });
    /* a shell update that has been waiting for the practice to end is now free to land */
    if (this._swPendingReload && this._swPoll) {
      this.dev.clearInterval(this._swPoll);
      this._swPoll = null;
      this._reloadNow();
    }
  }

  // ── the buttons ───────────────────────────────────────────────────────────────────────

  _setPaused(next, source) {
    if (this.paused === next) return;
    this.paused = next;
    this._msState(next ? 'paused' : 'playing');
    this.onEvent({ type: next ? 'paused' : 'resumed', source });
  }

  /* the in-app pause button. It toggles, and it stamps the self-control window first so the
   * external-pause watchdog does not second-guess a transport action we took ourselves. */
  togglePause() {
    if (!this.playing) return;
    this._lastSelfCtl = this.dev.now();
    const au = this.dev.audio;

    if (this.paused) {
      this._setPaused(false, 'button');
      /* a gap is real audio now, so resuming one is just play(). Only the timer-fallback
       * gap still needs its setTimeout rescheduled. */
      if (this.inGap && this._usingFallbackGap) {
        this.dev.clearTimeout(this._gapTimer);
        this._gapTimer = this.dev.setTimeout(() => {
          this.inGap = false;
          this._usingFallbackGap = false;
          this._advance();
        }, this._gapRemainMs);
        return;
      }
      this._msState('playing');
      /* §A4.7 — settle any owed advance BEFORE touching play(), or we replay the clip that
       * already finished. */
      if (this._endedWhilePaused) { this._endedWhilePaused = false; return this._onEnded(); }
      /* pressing play during a src swap used to hit a source that was mid-swap; play()
       * rejected and the practice went silent until the app reopened. If the element has no
       * usable source, re-arm the current clip instead of playing nothing. */
      if (!au.src || au.error || au.ended) return this._playCurrent();
      return this._tryPlay(() => this.armTapToStart());
    }

    this._setPaused(true, 'button');
    if (this.inGap && this._usingFallbackGap) {
      this.dev.clearTimeout(this._gapTimer);
    } else {
      try { au.pause(); } catch (e) {}
    }
  }

  /* five seconds back inside the current clip. Clips advance on `ended` and timeupdate only
   * drives captions, so seeking backward is safe. */
  rewind(seconds = 5) {
    if (!this.playing || this.finished) return;
    this._lastSelfCtl = this.dev.now();
    const au = this.dev.audio;
    try { au.currentTime = Math.max(this._trimStart || 0, (au.currentTime || 0) - seconds); } catch (e) {}
    if (!this.paused) this._tryPlay(() => this.armTapToStart());
  }

  previousBeat() { return this._jump(-1); }

  /* Forward one beat, immediately, cancelling whatever gap is running.
   *
   * ⚠️ This is NOT the `nexttrack` that §A4.5 deliberately leaves null. That is the LOCK
   * SCREEN's skip-forward, and it stays null because a practice is a sequence to be walked,
   * not scrubbed through by someone who is not looking at it. This is the in-page control
   * E5.34 requires — the skip on the first-practice intro, which exists so the tap that
   * matters at the capacity gate has been rehearsed once, cheaply. The page decides when it
   * is offered; the transport only knows how to move.
   *
   * It is also how a branch lands: the page rewrites the queue and then moves onto the beat
   * it just put there, whether the listener answered during the clip or during its silence. */

 *

 * │ Justin, 2026-08-10: "Nothing in the practice should hinge on somebody utilizing an     │
 * │ interactive element. They are always optional."                                        │
 * │                                                                                        │
 * │ THE TEST: if someone sets the phone face-down and never touches it, do they get a      │
 * │ complete, uncompromised practice? `session.test.js` asks exactly that, for every        │
 * │ config, and it is the first thing in the file.                                          │
 * └────────────────────────────────────────────────────────────────────────────────────────┘
 *

 *   1. The practice NEVER WAITS.      A choice window is a gap that was going to happen anyway.
 *   2. It NEVER BRANCHES ON ABSENCE.  No tap is not an answer; it is the default path.
 *   3. It NEVER ASKS TWICE.           A tap after the window closes is ignored, not queued.
 *   4. SILENCE IS NEVER AN ANSWER.    Not consent, not refusal. The question is dropped.

  ? require('./plan.js')
  : (typeof window !== 'undefined' ? window : globalThis).SNB_ENGINE_PLAN;

  ? require('./runtime.js')
  : (typeof window !== 'undefined' ? window : globalThis).SNB_ENGINE_RUNTIME;

  ? require('./host.js')
  : (typeof window !== 'undefined' ? window : globalThis).SNB_ENGINE_HOST;

   * someone who wants to physically interact. Include it as an option. It's harmless."). Doing
   * nothing still continues — the yes button does not change what happens, it gives the person a
   * way to SAY it, which matters for anyone who needs to do something with their hands. */

  FINISH: 'finish',         // one target: the open ending's "I'm done" (E5.32)

     * take says what is a fact about the script and this file is not allowed to know one.

    this._holdStartedAt = null;

      const continuing = this._control && this._controlKindFor(this.queue[e.index]) === this._control.control;
      if (!continuing) this._closeControl('window-closed');

     * opened here, once, when the gate that owns the rewind target goes by. */

     * applied, no branch is taken, nothing is queued for later. The practice simply carries on

    if (!c || c.control !== CONTROL.SKIP) return false;
    this._answered.add(c.index);

     * you to the Tiny Practice", so landing on `INTRO-FIRST-03` would be a control that did
     * not do what the audio just said it does. Walk forward over every consecutive skippable
     * beat and land on the first one that is not. */
    let n = 1;
    while (this.queue[this.runtime.idx + n] && this.queue[this.runtime.idx + n].skippable) n += 1;

   * (Justin, 2026-08-31): the spoken "no" at the curiosity gate and the "ease out" option at

   * answers. A button press has had no reply yet, so it gets one. */

   * block once the capacity gate has gone by. */

    return this._rewind();

   * ease-out; it does not replace it — the acknowledgment answers the tap, and the ease-out
   * does the redirecting-outward work it was written for. Then the close, whatever mode the
   * practice was in: an open-ended practice that eases out gets a real close, because the
   * open ending is not somewhere to be left. */
  _easeOut(from, ack) {

    this.easedOutFrom = from;

    tail.push(this._branchBeat(D.ROLE.easeOut, 'closing'));

   *

   * `branches[<first open-ending beat>] = { finish: FINISH_TO_CLOSE(shape) }` since the open ending

   * the people who stayed longest were the only ones who never heard the close chain at all.

   * guide you through, then hand it over, and you will finish when you're ready" — describing a
   * button that was never on screen. Justin, 2026-09-17, reading the open-mode running order:

   * to get to. Playing the full close chain is all we need here."
   *
   * 🔴 IT IS NOT THE EASE-OUT AND MUST NEVER SHARE ITS CLIP. Easing out is running out of
   * capacity; finishing a long open practice that went well is the opposite event and must not be
   * narrated as a retreat. Two controls, two routes, no shared audio, and no acknowledgment clip
   * here — nothing needs answering, they asked for the close and the close is the answer. */
  _finish() {
    if (this.finishedFrom || this.easedOutFrom) return false;
    const chain = this._finishChain();
    if (!chain) return false;
    this.finishedFrom = chain;
    const tail = [];
    /* ✅ THE READING GOES AT THE FRONT OF THE CLOSE (Justin, 2026-09-17: "Maybe we should have a
     * 0-10 at the end of an open practice when the user decides to stop?" — "agreed on all of the
     * final reading in an open practice").
     *
     * Until now the last number in an open practice was taken BEFORE the open ending began, so
     * somebody who stayed forty minutes carried a reading from the start of those forty minutes: it
     * measured the guided part and nothing of the part they actually chose to do. Taken here it is
     * the true final reading.
     *
     * NOT on the ease-out route — someone easing out has just said they are at capacity, and the
     * exit door is no place for a question.
     * NOT in the tiny practice — it takes no reading at all (TAG-MAP §3b, settled). `breath-only`
     * is the tiny practice's chain and the only one that skips it. */
    if (chain !== 'breath-only') tail.push(this._branchBeat(D.SAFETY_READING, 'closing'));
    this._closeOrderFor(chain).forEach(id => tail.push(this._branchBeat(id, 'closing')));
    tail.push(this._branchBeat(D.ROLE.outro, 'closing'));
    this._replaceTail(tail);
    /* The breath loop needs no teardown: it lives in the queue and `_replaceTail` truncates the
     * queue, so replacing the tail IS the teardown. That is the whole reason E3.11 built the loop
     * out of gaps rather than out of a timer. */
    this.onEvent({ type: 'finish', chain });
    this.runtime.nextBeat();
    return true;
  }

  /* The chain shape is read from the plan's own branch table, never named here — the two short
   * practices close on the intentional breath alone and the long ones run the whole chain (§3b),
   * and which is which is the planner's call, not this file's. */
  _finishChain() {
    const b = this.plan.beats.find(x => x.finishable);
    const branch = b && this.plan.branches[b.id];
    return (branch && branch.finish && branch.finish.kind === 'close') ? branch.finish.chain : null;
  }

  _closeOrderFor(chain) {
    if (chain === 'short') return P.MINDFULNESS_CLOSE;
    if (chain === 'breath-only') return [D.FAMILY.closes[D.FAMILY.closes.length - 1]];
    return P.CLOSE_ORDER;
  }

  /* E5.27 — MORE-SAFETY, then back to the general-safety beat and forward through EVERY step
   * again, the capacity gate included, re-validating and re-normalizing. Resuming mid-arc
   * would witness a defense that had not been re-validated since safety was re-established.
   * There is NO CAP: "if they want to go for 40 minutes, let them." */
  _rewind() {
    const target = this._rewindTarget();
    if (target < 0) return false;
    this.rewinds += 1;
    this._passes += 1;
    const tail = [this._branchBeat(D.ROLE.moreSafety, 'safety')];
    this.plan.beats.slice(target).forEach((b, i) => {
      /* 🔴 E5.27's second-pass take pin went with the capacity gate (2026-09-17). It made a
       * second pass favour a CAP-GATE-DEFENSE take that leads with "staying with safety is a
       * complete practice" — there is no such beat any more, so there is nothing to pin. The
       * emphasis it was reaching for belongs in the v3 band audio, where a low reading says it
       * outright instead of hoping a shuffle lands on the right take. */
      tail.push(Object.assign({}, b, { planIndex: target + i, pass: this._passes }));
    });
    this._replaceTail(tail);
    /* the gate asks again on its own terms — the tap is spent, so the window reopens on the
     * next pass rather than being remembered as already answered. */
    this._answered.clear();
    this.onEvent({ type: 'rewind', to: this.plan.beats[target].id, pass: this._passes, rewinds: this.rewinds });
    this.runtime.nextBeat();
    return true;
  }

  /* The rewind destination comes from the plan's own branch table, never from a name typed
   * here. It is asserted to be unambiguous: if the target ID appeared twice, "rewind to it"

  // ── what to tell the host ─────────────────────────────────────────────────────────────

  run() {
    return {
      completed: this.completed,
      minutes: this._startedAt == null ? null

      playedIndexes: this.playedIndexes.slice(),
      easedOutFrom: this.easedOutFrom,
      loops: this.loops,
