<script>(function(){try{var t=localStorage.getItem("snb_theme")||"";var e=document.documentElement;if(t==="dark")e.className+=(e.className?" ":"")+"theme-dark";else if(t==="light")e.className+=(e.className?" ":"")+"theme-light";var d=t==="dark"||(t!=="light"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);var m=document.querySelector("meta[name=theme-color]");if(m)m.setAttribute("content",d?"#1B1C1E":"#FAF9F5");}catch(e){}})();</script>

<body>
  <div class="shell">
    <div id="screen"><div class="boot" aria-hidden="true"><span class="boot-ring"></span></div></div>
  </div>
  <script src="current.js?v=14"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=7"></script>
  <script src="store.js?v=77"></script>
  <script src="from-justin.js?v=16"></script>
  <script src="icons.js"></script>
  <script src="app.js?v=245"></script>
  <script>
  /* installable PWA: register the /app/-scoped service worker; reload once when a
     new shell takes control so updates propagate without a manual reinstall. */
  /* 2026-08-17 — host half of the player trace, into the same log the beta bar shows.
     The player's own trace ends at "pagehide persisted=0" and cannot say WHO tore it
     down: us calling location.reload() off the service-worker path, or iOS discarding a
     backgrounded PWA page and reloading on return. Those need opposite fixes, so measure
     it rather than pick one. Staging and prod both, but it writes only to localStorage. */
  function hlog(tag, extra){
    try{
      const rows = JSON.parse(localStorage.getItem('snb_player_log')) || [];
      rows.push({ t:new Date().toISOString().slice(11,23), tag:tag,
                  vis: document.hidden ? 'hidden' : 'visible', pos:'-', ap:'-', st:'', src:'', x: extra||'' });
      if(rows.length > 400) rows.splice(0, rows.length - 400);
      localStorage.setItem('snb_player_log', JSON.stringify(rows));
    }catch(e){}
  }
  hlog('host:boot', 'nav=' + ((performance.getEntriesByType && (performance.getEntriesByType('navigation')[0]||{}).type) || '?'));
  addEventListener('pagehide', function(e){ hlog('host:pagehide', 'persisted=' + (e.persisted?1:0)); });
  document.addEventListener('visibilitychange', function(){ hlog('host:vis:' + (document.hidden ? 'hide' : 'show')); });
  if('serviceWorker' in navigator){
    /* 2026-08-16 — never reload, and never even check for an update, while a practice
       is running. The #weaver iframe is the tell. Full reasoning in player.html. */
    let _swReloaded=false, _swPendingReload=false;
    var _practiceOpen=function(){ try{ return !!document.getElementById('weaver'); }catch(e){ return false; } };
    function _reloadNow(){ if(_swReloaded) return; _swReloaded=true; hlog('host:reload','OURS — location.reload()'); location.reload(); }
    function _reloadWhenSafe(){
      if(!_practiceOpen()){ _reloadNow(); return; }
      if(_swPendingReload) return;
      _swPendingReload=true;
      var iv=setInterval(function(){ if(!_practiceOpen()){ clearInterval(iv); _reloadNow(); } }, 2000);
    }
    navigator.serviceWorker.addEventListener('controllerchange', function(){ hlog('host:controllerchange', 'weaver=' + (_practiceOpen()?1:0)); _reloadWhenSafe(); });
    function showUpdateToast(reg){
      if(document.getElementById('update-toast')) return;
      if(_practiceOpen()) return;            // never float a toast over a running practice
      var b=document.createElement('div'); b.id='update-toast'; b.className='update-toast';
      b.innerHTML='<span>A new version is ready.</span><button type="button">Refresh</button>';
      document.body.appendChild(b);
      requestAnimationFrame(function(){ b.classList.add('on'); });
      /* 2026-08-17 — the tap has to look like it did something. It used to hide the toast
         immediately and then sit there while the worker swapped, which read as a dead
         button. Now the toast stays put and the button says so until the reload lands. */
      b.querySelector('button').onclick=function(){
        var btn=this; btn.disabled=true; btn.textContent='Refreshing…';
        var w=reg.waiting;
        if(w){ w.postMessage({type:'SKIP_WAITING'}); } else { location.reload(); }
      };
    }
    addEventListener('load',()=>{
      navigator.serviceWorker.register('sw.js').then(function(reg){
        if(reg.waiting && navigator.serviceWorker.controller) showUpdateToast(reg);
        reg.addEventListener('updatefound',function(){ var w=reg.installing; if(!w) return; w.addEventListener('statechange',function(){ if(w.state==='installed' && navigator.serviceWorker.controller) showUpdateToast(reg); }); });
        try{reg.update();}catch(e){}
        /* iOS PWAs resume from memory, so an open app never re-checked for
           updates — you had to fully close and relaunch. Now every return to
           the foreground checks; skipWaiting + the controllerchange reload
           above do the rest, so updates apply within seconds of resuming. */
        document.addEventListener('visibilitychange',function(){
          if(document.hidden) return;
          if(_practiceOpen()) return;        // waking the screen mid-practice must not trigger an update
          try{reg.update();}catch(e){}
        });
      }).catch(function(){});
    });
  }
  </script>
</body>
</html>
